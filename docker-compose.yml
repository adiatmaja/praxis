services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
      args:
        # Set by the operator: `PRAXIS_BUILD_SHA=$(git rev-parse --short HEAD)`.
        # Stamps /health + /api/status so a stale image is visible.
        PRAXIS_BUILD_SHA: ${PRAXIS_BUILD_SHA:-dev}
    container_name: orchestrator
    ports:
      - "${PORT:-12323}:8080"
    volumes:
      # Named volume (not a host bind mount) for the SQLite DB.  On Docker Desktop
      # the host bind-mount filesystem (9p/virtiofs) does not support the shared-memory
      # / mmap semantics SQLite WAL needs, so `PRAGMA journal_mode=WAL` fails at startup
      # with "disk I/O error".  A named volume is backed by the Linux VM's ext4 and
      # works correctly; it also avoids DB-file contention with a local dev server.
      - praxis_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH keys for git clone over SSH.  Override SSH_KEY_PATH in .env to
      # mount only the specific key file instead of the full ~/.ssh directory.
      # Trust model: the orchestrator container runs as root; mounting ~/.ssh
      # gives it access to all host SSH keys.  Use a dedicated deploy key when
      # possible.
      - ${SSH_KEY_PATH:-~/.ssh}:/root/.ssh:ro
      # claude -p (planning/review/brainstorm) runs inside this container and
      # needs the host's subscription credentials. Without this mount every
      # Opus call fails even though /api/status reports "available".
      # NOTE: mounted read-write because `claude config set` writes to ~/.claude
      # during first-run setup.  If you are certain claude is already configured
      # you may add :ro here.  See docs/deployment.md "Security / Trust Model".
      - ${CLAUDE_CONFIG_PATH:-~/.claude}:/root/.claude
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DATABASE_URL=sqlite+aiosqlite:///data/orchestrator.db
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
      - HOST=0.0.0.0
      - PORT=8080
      # claude refuses --dangerously-skip-permissions as root (the container's
      # default user) unless it believes it runs in a sandbox. Brainstorm/plan/
      # review all pass that flag, so without this they exit 1 and silently fail.
      - IS_SANDBOX=1
      # Agents reach the orchestrator back via the HOST-side port, so this must
      # track ${PORT} (not the in-container 8080). Derived here so the two can
      # never drift apart and silently 404 every agent callback.
      - AGENT_CALLBACK_URL=${AGENT_CALLBACK_URL:-http://host.docker.internal:${PORT:-12323}/api/internal/agent-done}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orchestrator
    profiles:
      - hosted

volumes:
  praxis_data:
  caddy_data:
  caddy_config:
