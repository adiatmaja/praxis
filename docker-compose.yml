services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
      args:
        # Set by the operator: `PRAXIS_BUILD_SHA=$(git rev-parse --short HEAD)`.
        # Stamps /health + /api/status so a stale image is visible.
        PRAXIS_BUILD_SHA: ${PRAXIS_BUILD_SHA:-dev}
    container_name: orchestrator
    ports:
      - "${PORT:-12323}:8080"
    volumes:
      # Named volume (not a host bind mount) for the SQLite DB.  On Docker Desktop
      # the host bind-mount filesystem (9p/virtiofs) does not support the shared-memory
      # / mmap semantics SQLite WAL needs, so `PRAGMA journal_mode=WAL` fails at startup
      # with "disk I/O error".  A named volume is backed by the Linux VM's ext4 and
      # works correctly; it also avoids DB-file contention with a local dev server.
      - praxis_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH keys for git clone over SSH.  Override SSH_KEY_PATH in .env to
      # mount only the specific key file instead of the full ~/.ssh directory.
      # Trust model: the orchestrator container runs as root; mounting ~/.ssh
      # gives it access to all host SSH keys.  Use a dedicated deploy key when
      # possible.
      - ${SSH_KEY_PATH:-~/.ssh}:/root/.ssh:ro
      # claude -p (planning/review/brainstorm) runs inside this container and
      # needs the host's subscription credentials. Without this mount every
      # Opus call fails even though /api/status reports "available".
      # NOTE: mounted read-write because `claude config set` writes to ~/.claude
      # during first-run setup.  If you are certain claude is already configured
      # you may add :ro here.  See docs/deployment.md "Security / Trust Model".
      - ${CLAUDE_CONFIG_PATH:-~/.claude}:/root/.claude
      # Global settings, MOUNTED not baked: an operator edit takes effect on
      # `docker compose restart orchestrator`, never an image rebuild. This
      # retires the 2026-07-27 gotcha where a default_worker_* change silently
      # kept serving the baked-in value.
      - ./config:/app/config:ro
      # Harness entrypoint sources, read-only: `praxis doctor`'s
      # agent_image_freshness check HASHES docker/*/entrypoint.sh and compares
      # that against the org.praxis.entrypoint-sha256 LABEL baked into each
      # image. The image does not COPY docker/, so without this mount the check
      # compares nothing and a stale agent image keeps running old logic
      # silently, which is the exact failure the check exists to turn into a
      # red light.
      - ./docker:/app/docker:ro
      # .env, read-only, and it does TWO jobs.
      #
      # First, `praxis doctor`'s env_drift check compares the values the
      # container is actually running against the file on disk, because a key
      # compose FORWARDS is baked in when the container is created: `restart`
      # keeps the old value and only `up -d` recreates it.
      #
      # Second, this mount is the only way a key compose does NOT forward
      # (LOOP_INTERVAL, CALLBACK_GRACE) reaches the process at all, since
      # pydantic-settings reads /app/.env at startup. For those the commands
      # invert: `restart` applies the edit and `up -d` is a no-op whenever the
      # compose config itself is unchanged. Tell an operator `up -d` then
      # `restart`, which is right for both. env_drift can only see the first
      # half, because it compares keys the container actually received.
      #
      # Compose reads this file on the HOST to substitute variables; it never
      # enters the container on its own, so without this mount the check can
      # only ever answer "could not read .env" and the whole feature is inert.
      - ./.env:/app/.env:ro
    # Container-only variables, from a file git never sees.
    #
    # This exists for one job the `environment:` block below cannot do without
    # an edit to THIS file: opting out of a host Claude Code hook. ~/.claude is
    # mounted above, so the host's hooks run inside this container, and a hook
    # whose detector assumes the host OS (a VPN killswitch is the one that
    # keeps happening) blocks every brain call, tunnel up or down. The opt-out
    # variable's NAME is different for every hook, so it cannot be enumerated
    # here, and the remedy used to be "add a literal to docker-compose.yml",
    # which leaves a permanent diff in a tracked file in a fresh clone. That is
    # a remedy nobody can follow twice.
    #
    # `env_file` passes EVERY key in the named file into the container, unlike
    # `.env`, which compose reads on the host for substitution only. It is
    # gitignored, and `required: false` means an install without one starts
    # normally. Settings uses extra="ignore", so a variable here that is not a
    # settings field is carried to the process and ignored by pydantic, which
    # is exactly what a hook opt-out needs.
    #
    # `required:` needs Docker Compose 2.24.0 or later (checked against the
    # Compose specification, 2026-08-21). Below that version compose treats
    # every entry as required and refuses to start when the file is absent,
    # which is a loud failure rather than a silent one, and the fix is either
    # to upgrade compose or to `touch .env.container`.
    env_file:
      - path: ./.env.container
        required: false
    # Bound log rotation prevents json-file log growth from making `docker logs`
    # seek slowly or hang on Docker Desktop for Windows (unbounded json-file logs
    # accumulate metadata Docker must scan on every `docker logs` call).
    # 10 MB x 5 files = 50 MB max; adjust max-size/max-file in .env if needed.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DATABASE_URL=sqlite+aiosqlite:///data/orchestrator.db
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
      # The worker preset `praxis init` records in .env. Listed BARE (compose's
      # pass-through form), never as `${VAR}` or `${VAR:-default}`. Settings
      # precedence is environment > .env > the settings YAML > field default,
      # and verified against Docker Compose v5.3.0: an unset `- VAR=${VAR}`
      # resolves to `VAR: ""`, which is a set-but-empty variable that suppresses
      # the mounted YAML for good; the bare form resolves to `VAR: null` and is
      # simply not set, so an operator who chose no preset keeps the YAML in
      # charge. The bare form still reads the project .env, which is where init
      # writes.
      #
      # The `.env` layer in that order is new. Until it landed, a key present in
      # BOTH .env and the settings YAML silently took the YAML's value, because
      # the YAML is injected as an init kwarg and those outrank pydantic's
      # dotenv source. These two keys were the case that bit: forwarded here
      # they won inside a container and lost under a bare uvicorn, from the same
      # file, with nothing reporting the difference.
      - DEFAULT_WORKER_HARNESS
      - DEFAULT_WORKER_MODEL
      - HOST=0.0.0.0
      - PORT=8080
      # Container timezone.  Keeps log timestamps in sync with the host so
      # `docker logs --since` works correctly.  Docker Desktop / WSL2 can drift
      # after sleep; override TZ in .env to match your local zone (e.g. Asia/Jakarta).
      - TZ=${TZ:-UTC}
      # claude refuses --dangerously-skip-permissions as root (the container's
      # default user) unless it believes it runs in a sandbox. Brainstorm/plan/
      # review all pass that flag, so without this they exit 1 and silently fail.
      - IS_SANDBOX=1
      # HOOK OPT-OUTS DO NOT GO HERE any more. Put them in `.env.container`,
      # the gitignored `env_file` declared above:
      #
      #   echo CLAUDE_VPN_KILLSWITCH_OFF=1 >> .env.container
      #   docker compose up -d
      #
      # They must NOT go in `.env`. Compose reads that file on the host to
      # substitute variables and passes nothing from it into the container on
      # its own, so an opt-out there never reaches the process and the hook
      # keeps firing, which reads as "the documented fix does not work".
      #
      # Editing this block still works and is still read first, but it dirties
      # a TRACKED file, so a fresh clone that follows the doctor's remedy ends
      # up with a permanent local diff. See docs/gotchas.md.
      # Agents reach the orchestrator back via the HOST-side port, so this must
      # track ${PORT} (not the in-container 8080). Derived here so the two can
      # never drift apart and silently 404 every agent callback.
      - AGENT_CALLBACK_URL=${AGENT_CALLBACK_URL:-http://host.docker.internal:${PORT:-12323}/api/internal/agent-done}
      # Name of the Docker volume holding agy (Gemini) OAuth credentials.  Populate
      # it once with an interactive `agy login` (see docs/deployment.md); the
      # orchestrator mounts it RW into agy-agent containers at /home/agent/.gemini.
      - GEMINI_CREDS_VOLUME=${GEMINI_CREDS_VOLUME:-praxis-gemini-creds}
      - OPENCODE_SESSIONS_VOLUME=${OPENCODE_SESSIONS_VOLUME:-praxis-opencode-sessions}
      # Points core/settings_file.config_file_path() at the ./config mount above
      # instead of the copy baked into the image at build time.
      - PRAXIS_CONFIG_PATH=/app/config/praxis.yaml
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Build-only entries so ONE documented command builds every image the
  # orchestrator can spawn: `docker compose --profile agents build`. These are
  # not long-running services; the `agents` profile keeps them out of a plain
  # `docker compose up`. Note that an entrypoint.sh change still requires a
  # rebuild; `praxis doctor` detects a stale image and says so.
  opencode-agent:
    build:
      context: docker/opencode-agent
      dockerfile: Dockerfile
      args:
        PRAXIS_ENTRYPOINT_SHA256: ${OPENCODE_ENTRYPOINT_SHA256:-}
    image: opencode-agent:latest
    command: ["true"]
    profiles:
      - agents

  agy-agent:
    build:
      context: docker/agy-agent
      dockerfile: Dockerfile
      args:
        PRAXIS_ENTRYPOINT_SHA256: ${AGY_ENTRYPOINT_SHA256:-}
    image: agy-agent:latest
    command: ["true"]
    profiles:
      - agents

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # The Caddyfile is `{$DOMAIN:localhost} { ... }`, and Caddy reads DOMAIN
      # from its OWN environment, not from compose's substitution context. With
      # no environment block here the documented
      # `DOMAIN=praxis.example.com docker compose --profile hosted up` produced
      # a site bound to localhost, so auto-HTTPS could never be issued and the
      # only symptom was a certificate that never arrived.
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - orchestrator
    profiles:
      - hosted

volumes:
  praxis_data:
  caddy_data:
  caddy_config:
