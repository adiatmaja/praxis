<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f7f5;
      --panel: #ffffff;
      --panel-alt: #f2f2ef;
      --border: #dfdfda;
      --border-subtle: #eeeeea;
      --text: #171717;
      --text-muted: #666a70;
      --text-faint: #9a9da2;
      --hover-bg: #f0f1ec;
      --active-bg: #e9ebe4;
      --selected-bg: #eef4f0;
      --selected-border: #245846;
      --log-bg: #111312;
      --log-text: #dce7df;
      --btn-primary-bg: transparent;
      --btn-primary-text: #4f5358;
      --btn-primary-border: #d8d8d2;
      --btn-secondary-bg: transparent;
      --btn-secondary-text: #4f5358;
      --btn-secondary-border: #d8d8d2;
      --btn-danger-text: #b91c1c;
      --badge-active-bg: #dbeafe; --badge-active-text: #1d4ed8;
      --badge-pending-bg: #ecefed; --badge-pending-text: #5f666b;
      --badge-passed-bg: #dcfce7; --badge-passed-text: #15803d;
      --badge-merged-bg: #dcfce7; --badge-merged-text: #15803d;
      --badge-completed-bg: #dcfce7; --badge-completed-text: #15803d;
      --badge-reviewing-bg: #fef3c7; --badge-reviewing-text: #b45309;
      --badge-failed-bg: #fee2e2; --badge-failed-text: #dc2626;
      --badge-rejected-bg: #fee2e2; --badge-rejected-text: #dc2626;
    }

    [data-theme="dark"] {
      --bg: #1c1c1e;
      --panel: #222224;
      --panel-alt: #1b1b1d;
      --border: #303033;
      --border-subtle: #29292c;
      --text: #d9d9dc;
      --text-muted: #9a9a9f;
      --text-faint: #66666d;
      --hover-bg: #2a2a2d;
      --active-bg: #313135;
      --selected-bg: #252b28;
      --selected-border: #8bc4a8;
      --log-bg: #141416;
      --log-text: #d6ddd8;
      --btn-primary-bg: transparent;
      --btn-primary-text: #d9d9dc;
      --btn-primary-border: #5a5a61;
      --btn-secondary-bg: transparent;
      --btn-secondary-text: #b0b0b6;
      --btn-secondary-border: #3d3d42;
      --btn-danger-text: #fca5a5;
      --badge-active-bg: #1e3a5f; --badge-active-text: #60a5fa;
      --badge-pending-bg: #2e2e30; --badge-pending-text: #a1a1aa;
      --badge-passed-bg: #14532d; --badge-passed-text: #86efac;
      --badge-merged-bg: #14532d; --badge-merged-text: #86efac;
      --badge-completed-bg: #14532d; --badge-completed-text: #86efac;
      --badge-reviewing-bg: #451a03; --badge-reviewing-text: #fbbf24;
      --badge-failed-bg: #450a0a; --badge-failed-text: #fca5a5;
      --badge-rejected-bg: #450a0a; --badge-rejected-text: #fca5a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }
    a { color: var(--text-muted); text-decoration: none; }
    a:hover { color: var(--text); text-decoration: underline; }
    label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 12px; font-weight: 500; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
    }
    textarea { min-height: 140px; resize: vertical; line-height: 1.45; }

    .sidebar {
      width: 240px;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }
    .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-logo { font-size: 18px; font-weight: 700; letter-spacing: 0; }
    .sidebar-logo span { margin-left: 8px; color: var(--text-faint); font-size: 12px; font-weight: 400; }
    .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
    .nav-section {
      padding: 16px 10px 6px;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .nav-section:first-child { padding-top: 4px; }
    .nav-item {
      width: 100%;
      height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
    }
    .nav-item:hover { background: var(--hover-bg); color: var(--text); }
    .nav-item.active { background: var(--active-bg); color: var(--text); }
    .nav-icon { width: 18px; color: var(--text-faint); text-align: center; }

    .sidebar-stats, .sidebar-connections { padding: 14px 20px; border-top: 1px solid var(--border); }
    .section-label {
      margin-bottom: 8px;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .stat-row { display: flex; justify-content: space-between; padding: 4px 0; color: var(--text-muted); font-size: 12px; }
    .stat-row strong { color: var(--text); font-weight: 700; }
    .connection-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 9px; min-width: 0; }
    .connection-row:last-child { margin-bottom: 0; }
    .conn-dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; flex-shrink: 0; background: var(--text-faint); }
    .conn-dot.connected { background: #22c55e; }
    .conn-dot.disconnected { background: #ef4444; }
    .conn-dot.rate_limited { background: #eab308; }
    .conn-info { min-width: 0; color: var(--text-muted); font-size: 12px; }
    .conn-role { color: var(--text); font-weight: 700; }
    .conn-model { overflow: hidden; color: var(--text-faint); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .topbar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .topbar-title { min-width: 0; overflow: hidden; font-size: 15px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid var(--btn-secondary-border);
      border-radius: 6px;
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      padding: 0 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-primary { background: var(--btn-primary-bg); color: var(--btn-primary-text); border-color: var(--btn-primary-border); }
    .btn-primary:hover { opacity: .85; }
    .btn-danger { color: var(--btn-danger-text); }
    .btn-compact { height: 28px; padding: 0 9px; font-size: 11px; }
    .theme-btn { width: 32px; padding: 0; font-size: 15px; }

    .master-detail { min-height: 0; flex: 1; display: flex; overflow: hidden; }
    .master-panel {
      width: 48%;
      min-width: 360px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }
    .master-header {
      min-height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .master-title { color: var(--text-muted); font-size: 13px; font-weight: 700; }
    .master-list { flex: 1; overflow-y: auto; }
    .master-row {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border: 0;
      border-bottom: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .master-row:hover { background: var(--hover-bg); }
    .master-row.selected { background: var(--selected-bg); border-left: 2px solid var(--selected-border); padding-left: 18px; }
    .row-main { min-width: 0; flex: 1; }
    .row-name { overflow: hidden; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { overflow: hidden; color: var(--text-faint); font-family: "Cascadia Mono", "SF Mono", Consolas, monospace; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

    .badge {
      height: 20px;
      display: inline-flex;
      align-items: center;
      border-radius: 4px;
      padding: 0 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge.active, .badge.in_progress { background: var(--badge-active-bg); color: var(--badge-active-text); }
    .badge.pending { background: var(--badge-pending-bg); color: var(--badge-pending-text); }
    .badge.passed { background: var(--badge-passed-bg); color: var(--badge-passed-text); }
    .badge.merged { background: var(--badge-merged-bg); color: var(--badge-merged-text); }
    .badge.completed { background: var(--badge-completed-bg); color: var(--badge-completed-text); }
    .badge.reviewing { background: var(--badge-reviewing-bg); color: var(--badge-reviewing-text); }
    .badge.failed, .badge.rejected { background: var(--badge-failed-bg); color: var(--badge-failed-text); }
    .badge.stopped { background: var(--badge-failed-bg); color: var(--badge-failed-text); }

    .detail-panel { min-width: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .detail-header { flex-shrink: 0; padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--border-subtle); }
    .detail-title { margin-bottom: 4px; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
    .detail-subtitle { color: var(--text-faint); font-size: 12px; overflow-wrap: anywhere; }
    .detail-content { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .detail-section { margin-bottom: 20px; }
    .detail-section-title {
      margin-bottom: 10px;
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .detail-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .detail-field { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
    .detail-field:last-child { border-bottom: 0; }
    .field-label { color: var(--text-muted); font-size: 12px; }
    .field-value { min-width: 0; color: var(--text); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; text-align: right; }
    .detail-actions { flex-shrink: 0; display: flex; gap: 8px; padding: 14px 24px; background: var(--panel); border-top: 1px solid var(--border); }
    .detail-empty { margin: auto; color: var(--text-faint); font-size: 13px; }
    .formrow { margin-bottom: 12px; }
    .form-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .log {
      width: 100%;
      height: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--log-bg);
      color: var(--log-text);
      padding: 12px;
      font-family: "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty-list { padding: 20px; color: var(--text-faint); font-size: 13px; }

    .json-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .json-toggle-btn {
      height: 26px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 0 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .json-toggle-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .json-toggle-btn.active { background: var(--active-bg); color: var(--text); }
    .opus-plan-pretty .op-summary { margin-bottom: 12px; font-size: 13px; font-weight: 600; line-height: 1.5; }
    .opus-plan-pretty .op-task { margin-bottom: 14px; padding: 12px; background: var(--bg); border: 1px solid var(--border-subtle); border-radius: 6px; }
    .opus-plan-pretty .op-task:last-child { margin-bottom: 0; }
    .opus-plan-pretty .op-task-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .opus-plan-pretty .op-task-slug { font-family: "Cascadia Mono", "SF Mono", Consolas, monospace; font-size: 11px; color: var(--text-faint); margin-bottom: 8px; }
    .opus-plan-pretty .op-task-desc { font-size: 12px; line-height: 1.55; color: var(--text-muted); white-space: pre-wrap; }
    .opus-plan-pretty .op-task-deps { margin-top: 6px; font-size: 11px; color: var(--text-faint); }

    @media (max-width: 1024px) {
      .sidebar { width: 204px; }
      .master-panel { width: 46%; min-width: 320px; }
    }
    @media (max-width: 768px) {
      body { flex-direction: column; overflow: auto; height: auto; min-height: 100vh; }
      .sidebar { width: 100%; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      .sidebar-nav { display: flex; gap: 6px; padding: 10px; overflow-x: auto; }
      .nav-section { display: none; }
      .nav-item { width: auto; min-width: 104px; justify-content: center; }
      .sidebar-stats, .sidebar-connections { display: none; }
      .main { min-height: 720px; }
      .topbar { padding: 0 14px; }
      .master-detail { flex-direction: column; overflow: visible; }
      .master-panel { width: 100%; min-width: 0; max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--border); }
      .detail-panel { min-height: 420px; }
      .detail-content { padding: 16px; }
      .detail-actions { padding: 12px 16px; }
    }

    /* Dashboard view */
    .health-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--panel-alt);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .health-item { display: flex; align-items: center; gap: 6px; }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .health-dot.available { background: #22c55e; }
    .health-dot.rate_limited { background: #eab308; }
    .health-dot.resuming { background: #ef4444; }
    .health-attention {
      background: var(--badge-reviewing-bg);
      color: var(--badge-reviewing-text);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .health-spacer { margin-left: auto; }

    .dashboard-body { flex: 1; overflow-y: auto; padding: 0; display: flex; }
    .dashboard-lanes { flex: 1; min-width: 0; overflow-y: auto; }

    .swim-lane { border-bottom: 1px solid var(--border); }
    .lane-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      flex-wrap: wrap;
    }
    .lane-spec { font-size: 13px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .lane-meta { color: var(--text-faint); font-size: 11px; font-family: "Cascadia Mono", "SF Mono", Consolas, monospace; white-space: nowrap; }
    .lane-spec-full { padding: 0 20px 12px; font-size: 13px; line-height: 1.6; color: var(--text-muted); white-space: pre-wrap; }

    .lane-cards { display: flex; gap: 10px; padding: 0 20px 14px; overflow-x: auto; }
    .task-card {
      min-width: 170px;
      max-width: 220px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      background: var(--panel);
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }
    .task-card:hover { border-color: var(--text-faint); }
    .task-card.selected { border-color: var(--selected-border); border-width: 2px; padding: 9px 11px; }
    .task-card.status-merged { border-left: 3px solid var(--badge-passed-text); opacity: 0.75; }
    .task-card.status-passed { border-left: 3px solid var(--badge-passed-text); }
    .task-card.status-reviewing { border-left: 3px solid var(--badge-reviewing-text); }
    .task-card.status-in_progress { border-left: 3px solid var(--badge-active-text); }
    .task-card.status-failed { border-left: 3px solid var(--badge-failed-text); background: var(--badge-failed-bg); background: color-mix(in srgb, var(--badge-failed-bg) 20%, var(--panel)); }
    .task-card.status-pending { border-left: 3px solid var(--text-faint); }
    .card-title { font-size: 12px; font-weight: 700; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-meta { font-size: 10px; color: var(--text-faint); margin-top: 4px; }
    .card-log-line { font-size: 10px; color: var(--badge-active-text); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "Cascadia Mono", "SF Mono", Consolas, monospace; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    .pulse-dot.green { background: #22c55e; }
    .pulse-dot.amber { background: #eab308; }

    .completed-lane { opacity: 0.6; transition: opacity 0.2s; }
    .completed-lane.expanded { opacity: 1; }
    .completed-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 13px;
    }
    .completed-header:hover { background: var(--hover-bg); }
    .disclosure { font-size: 10px; color: var(--text-faint); transition: transform 0.2s; }
    .disclosure.open { transform: rotate(90deg); }
    .completed-meta { color: var(--text-faint); font-size: 11px; }

    .side-panel {
      width: 0;
      overflow: hidden;
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease;
      flex-shrink: 0;
    }
    .side-panel.open { width: 35%; min-width: 320px; }
    .side-panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .side-panel-close {
      border: 0;
      background: transparent;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 4px;
    }
    .side-panel-close:hover { color: var(--text); }
    .side-panel-content { flex: 1; overflow-y: auto; padding: 16px; }
    .side-panel-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
    .side-panel-log {
      height: 180px;
      overflow-y: auto;
      background: var(--log-bg);
      color: var(--log-text);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .dashboard-idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px 20px;
      color: var(--text-faint);
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .side-panel.open { width: 100%; min-width: 0; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
      .lane-cards { flex-wrap: wrap; }
      .task-card { min-width: 140px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Praxis <span>orchestrator</span></div>
    </div>
    <nav class="sidebar-nav" aria-label="Views">
      <div class="nav-section">Workspace</div>
      <button class="nav-item active" type="button" data-view="dashboard" onclick="switchView('dashboard')"><span class="nav-icon">D</span>Dashboard</button>
      <button class="nav-item" type="button" data-view="projects" onclick="switchView('projects')"><span class="nav-icon">P</span>Projects</button>
      <button class="nav-item" type="button" data-view="plans" onclick="switchView('plans')"><span class="nav-icon">S</span>Plans</button>
      <button class="nav-item" type="button" data-view="tasks" onclick="switchView('tasks')"><span class="nav-icon">T</span>Tasks</button>
      <button class="nav-item" type="button" data-view="logs" onclick="switchView('logs')"><span class="nav-icon">L</span>Live Logs</button>
    </nav>
    <div class="sidebar-stats">
      <div class="section-label">Stats</div>
      <div class="stat-row"><span>Projects</span><strong id="stat-projects">0</strong></div>
      <div class="stat-row"><span>Plans</span><strong id="stat-plans">0</strong></div>
      <div class="stat-row"><span>Agents</span><strong id="stat-agents">0</strong></div>
      <div class="stat-row"><span>Queue</span><strong id="stat-queue">0</strong></div>
    </div>
    <div class="sidebar-connections">
      <div class="section-label">Connections</div>
      <div class="connection-row">
        <span id="agent-dot" class="conn-dot disconnected"></span>
        <div class="conn-info">
          <div class="conn-role">Agent</div>
          <div id="agent-model" class="conn-model">unknown</div>
        </div>
      </div>
      <div class="connection-row">
        <span id="subagent-dot" class="conn-dot disconnected"></span>
        <div class="conn-info">
          <div class="conn-role">Subagent</div>
          <div id="subagent-model" class="conn-model">unknown</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="topbar-title" class="topbar-title">Projects</div>
      <div class="topbar-actions">
        <button id="primary-action" class="btn btn-primary" type="button" onclick="primaryAction()">+ New Project</button>
        <button class="btn theme-btn" type="button" onclick="toggleTheme()" title="Toggle theme">T</button>
        <button class="btn" type="button" onclick="resetToken()">Token</button>
      </div>
    </header>
    <section id="view-container" class="master-detail"></section>
  </main>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem("praxis_token") || "";
    let eventSource = null;
    let currentView = "dashboard";
    let projects = [];
    let plans = [];
    let currentTasks = [];
    let selectedProjectId = null;
    let selectedPlanId = null;
    let selectedTaskId = null;
    let showingForm = false;
    let dashboardTasks = {};       // map: planId -> tasks[]
    let dashboardTaskLogs = {};    // map: taskId -> last log line
    let selectedDashboardTaskId = null;
    let expandedCompletedPlans = new Set();
    let expandedSpecs = new Set();
    let dashboardSseSource = null;

    initTheme();

    function initTheme() {
      const stored = localStorage.getItem("praxis_theme") || "light";
      document.documentElement.dataset.theme = stored;
    }

    function toggleTheme() {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("praxis_theme", next);
    }

    function ensureToken() {
      if (!token) resetToken();
      return token;
    }

    function resetToken() {
      token = window.prompt("API token", token) || "";
      localStorage.setItem("praxis_token", token);
      pollStatus();
    }

    function headers() {
      return {
        "Authorization": "Bearer " + ensureToken(),
        "Content-Type": "application/json"
      };
    }

    async function api(method, path, body) {
      const options = { method, headers: headers() };
      if (body !== undefined) options.body = JSON.stringify(body);
      const response = await fetch(API + path, options);
      if (!response.ok) throw new Error(await response.text());
      if (response.status === 204) return null;
      return response.json();
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function jsArg(value) {
      return esc(JSON.stringify(String(value ?? "")));
    }

    function safeHref(value) {
      try {
        const url = new URL(String(value ?? ""), window.location.href);
        if (url.protocol === "http:" || url.protocol === "https:") return esc(url.href);
      } catch (error) {
        return "";
      }
      return "";
    }

    function badge(status) {
      return '<span class="badge ' + esc(status) + '">' + esc(status) + '</span>';
    }

    function mono(value) {
      return '<span style="font-family:Cascadia Mono, SF Mono, Consolas, monospace;font-size:12px;">' + esc(value || "-") + '</span>';
    }

    function setTopbar(title, actionLabel) {
      document.getElementById("topbar-title").textContent = title;
      document.getElementById("primary-action").textContent = actionLabel;
    }

    function primaryAction() {
      if (currentView === "dashboard") {
        switchView("plans");
        showingForm = true;
        renderPlansView();
      } else if (currentView === "projects") {
        showingForm = true;
        renderProjectsView();
      } else if (currentView === "plans") {
        showingForm = true;
        renderPlansView();
      } else if (currentView === "tasks") {
        renderTasks();
      } else {
        connectEvents();
      }
    }

    async function switchView(name) {
      currentView = name;
      showingForm = false;
      document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view === name));
      if (eventSource && name !== "logs" && name !== "dashboard") {
        eventSource.close();
        eventSource = null;
      }
      if (name === "dashboard") {
        setTopbar("Dashboard", "+ Submit Spec");
        await loadDashboard();
      } else if (name === "projects") {
        setTopbar("Projects", "+ New Project");
        await loadProjects();
      } else if (name === "plans") {
        setTopbar("Plans", "+ Submit Spec");
        await loadPlans();
      } else if (name === "tasks") {
        setTopbar("Tasks", "Refresh");
        await renderTasks();
      } else if (name === "logs") {
        setTopbar("Live Logs", "Reconnect");
        renderLogs();
      }
    }

    async function loadProjects() {
      projects = await api("GET", "/api/projects");
      if (!selectedProjectId && projects.length) selectedProjectId = projects[0].id;
      if (!projects.some(project => project.id === selectedProjectId)) selectedProjectId = projects[0]?.id || null;
      document.getElementById("stat-projects").textContent = projects.length;
      if (currentView === "projects") renderProjectsView();
    }

    async function loadPlans() {
      if (!projects.length) await loadProjects();
      plans = [];
      for (const project of projects) {
        const projectPlans = await api("GET", "/api/projects/" + project.id + "/plans");
        plans.push(...projectPlans.map(plan => ({ ...plan, projectName: project.name })));
      }
      if (!selectedPlanId && plans.length) selectedPlanId = plans[0].id;
      if (!plans.some(plan => plan.id === selectedPlanId)) selectedPlanId = plans[0]?.id || null;
      document.getElementById("stat-plans").textContent = plans.length;
      if (currentView === "plans") renderPlansView();
    }

    function renderProjectsView() {
      const container = document.getElementById("view-container");
      const masterRows = projects.map(project =>
        '<button class="master-row' + (selectedProjectId === project.id ? ' selected' : '') +
        '" type="button" onclick="selectProject(\'' + esc(project.id) + '\')">' +
          '<div class="row-main"><div class="row-name">' + esc(project.name) + '</div>' +
          '<div class="row-meta">' + esc(project.repo_url) + '</div></div>' +
          (project.approval_gate ? badge("active") : badge("pending")) +
        '</button>'
      ).join("") || '<div class="empty-list">No projects</div>';
      const detail = showingForm ? renderProjectForm() :
        selectedProjectId ? renderProjectDetail(projects.find(project => project.id === selectedProjectId)) :
        '<div class="detail-empty">Select a project</div>';

      container.innerHTML =
        '<div class="master-panel">' +
          '<div class="master-header"><div class="master-title">' + projects.length + ' Projects</div>' +
          '<button class="btn btn-compact" type="button" onclick="loadProjects()">Refresh</button></div>' +
          '<div class="master-list">' + masterRows + '</div>' +
        '</div><div class="detail-panel">' + detail + '</div>';
    }

    function selectProject(id) {
      selectedProjectId = id;
      showingForm = false;
      renderProjectsView();
    }

    function renderProjectDetail(project) {
      if (!project) return '<div class="detail-empty">Project not found</div>';
      return '<div class="detail-header">' +
        '<div class="detail-title">' + esc(project.name) + '</div>' +
        '<div class="detail-subtitle">' + esc(project.repo_url) + '</div>' +
      '</div><div class="detail-content">' +
        '<div class="detail-section"><div class="detail-section-title">Configuration</div><div class="detail-card">' +
          '<div class="detail-field"><span class="field-label">Model</span><span class="field-value">' + mono(project.model_name) + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Default Branch</span><span class="field-value">' + esc(project.default_branch) + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Approval Gate</span><span class="field-value">' + (project.approval_gate ? "On" : "Off") + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Max Retries</span><span class="field-value">' + esc(project.max_retries) + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Confidence Threshold</span><span class="field-value">' + Math.round((project.confidence_threshold || 0) * 100) + '%</span></div>' +
          '<div class="detail-field"><span class="field-label">LM Studio</span><span class="field-value">' + mono(project.lm_studio_url) + '</span></div>' +
        '</div></div>' +
      '</div><div class="detail-actions">' +
        '<button class="btn btn-primary" type="button" onclick="switchView(\'plans\')">View Plans</button>' +
        '<button class="btn btn-danger" type="button" onclick="deleteProject(\'' + esc(project.id) + '\')">Delete</button>' +
      '</div>';
    }

    function renderProjectForm() {
      return '<div class="detail-header"><div class="detail-title">New Project</div>' +
        '<div class="detail-subtitle">Add a repository for orchestration</div></div>' +
        '<div class="detail-content"><form onsubmit="submitProject(event)">' +
          '<div class="formrow"><label>Name</label><input id="pf-name" required autocomplete="off"></div>' +
          '<div class="formrow"><label>Repository URL</label><input id="pf-repo" required autocomplete="off" placeholder="https://github.com/user/repo"></div>' +
          '<div class="formrow"><label>Model</label><input id="pf-model" required autocomplete="off" value="deepseek-coder-v2"></div>' +
          '<div class="form-actions"><button type="submit" class="btn btn-primary">Create</button>' +
          '<button type="button" class="btn" onclick="showingForm=false;renderProjectsView()">Cancel</button></div>' +
        '</form></div>';
    }

    async function submitProject(event) {
      event.preventDefault();
      const project = await api("POST", "/api/projects", {
        name: document.getElementById("pf-name").value,
        repo_url: document.getElementById("pf-repo").value,
        model_name: document.getElementById("pf-model").value
      });
      selectedProjectId = project.id;
      showingForm = false;
      await loadProjects();
    }

    async function deleteProject(id) {
      if (!confirm("Delete this project?")) return;
      await api("DELETE", "/api/projects/" + id);
      selectedProjectId = null;
      selectedPlanId = null;
      await loadProjects();
    }

    function renderPlansView() {
      const container = document.getElementById("view-container");
      const masterRows = plans.map(plan =>
        '<button class="master-row' + (selectedPlanId === plan.id ? ' selected' : '') +
        '" type="button" onclick="selectPlan(\'' + esc(plan.id) + '\')">' +
          '<div class="row-main"><div class="row-name">' + esc(plan.spec).slice(0, 100) + '</div>' +
          '<div class="row-meta">' + esc(plan.projectName) + '</div></div>' + badge(plan.status) +
        '</button>'
      ).join("") || '<div class="empty-list">No plans</div>';
      const detail = showingForm ? renderPlanForm() :
        selectedPlanId ? renderPlanDetail(plans.find(plan => plan.id === selectedPlanId)) :
        '<div class="detail-empty">Select a plan</div>';

      container.innerHTML =
        '<div class="master-panel">' +
          '<div class="master-header"><div class="master-title">' + plans.length + ' Plans</div>' +
          '<button class="btn btn-compact" type="button" onclick="loadPlans()">Refresh</button></div>' +
          '<div class="master-list">' + masterRows + '</div>' +
        '</div><div class="detail-panel">' + detail + '</div>';
    }

    function selectPlan(id) {
      selectedPlanId = id;
      showingForm = false;
      renderPlansView();
    }

    function renderPlanDetail(plan) {
      if (!plan) return '<div class="detail-empty">Plan not found</div>';
      const approveReject = (plan.status === "pending" && plan.source === "autonomous") ?
        '<button class="btn btn-primary" type="button" onclick="approvePlan(\'' + esc(plan.id) + '\')">Approve</button>' +
        '<button class="btn btn-danger" type="button" onclick="rejectPlan(\'' + esc(plan.id) + '\')">Reject</button>' : "";
      return '<div class="detail-header"><div class="detail-title">' + esc(plan.projectName) + '</div>' +
        '<div class="detail-subtitle">Source: ' + esc(plan.source) + ' &middot; Confidence: ' +
        (plan.confidence != null ? Math.round(plan.confidence * 100) + "%" : "-") + '</div></div>' +
        '<div class="detail-content">' +
          '<div class="detail-section"><div class="detail-section-title">Specification</div>' +
          '<div class="detail-card" style="white-space:pre-wrap;font-size:13px;line-height:1.6;">' + esc(plan.spec) + '</div></div>' +
          (plan.opus_plan ? renderOpusPlan(plan.opus_plan, plan.id) : "") +
          '<div class="detail-section"><div class="detail-section-title">Status</div><div class="detail-card">' +
          '<div class="detail-field"><span class="field-label">Status</span><span class="field-value">' + badge(plan.status) + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Branch</span><span class="field-value">' + mono(plan.plan_branch_name) + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Created</span><span class="field-value">' + esc(plan.created_at) + '</span></div>' +
          '</div></div></div>' +
          (approveReject ? '<div class="detail-actions">' + approveReject + '</div>' : "");
    }

    function renderPlanForm() {
      const opts = projects.map(project => '<option value="' + esc(project.id) + '">' + esc(project.name) + '</option>').join("");
      return '<div class="detail-header"><div class="detail-title">Submit Spec</div>' +
        '<div class="detail-subtitle">Create a new plan from a specification</div></div>' +
        '<div class="detail-content"><form onsubmit="submitPlan(event)">' +
          '<div class="formrow"><label>Project</label><select id="plf-project" required>' + opts + '</select></div>' +
          '<div class="formrow"><label>Specification</label><textarea id="plf-spec" required></textarea></div>' +
          '<div class="form-actions"><button type="submit" class="btn btn-primary">Submit</button>' +
          '<button type="button" class="btn" onclick="showingForm=false;renderPlansView()">Cancel</button></div>' +
        '</form></div>';
    }

    async function submitPlan(event) {
      event.preventDefault();
      const projectId = document.getElementById("plf-project").value;
      const plan = await api("POST", "/api/projects/" + projectId + "/plans", {
        spec: document.getElementById("plf-spec").value
      });
      selectedPlanId = plan.id;
      showingForm = false;
      await loadPlans();
    }

    let opusPlanViewMode = {};

    function renderOpusPlan(raw, planId) {
      const mode = opusPlanViewMode[planId] || "pretty";
      const toggleHtml = '<div style="display:flex;align-items:center;justify-content:space-between;">' +
        '<div class="detail-section-title" style="margin-bottom:0;">Opus Plan</div>' +
        '<div class="json-toggle">' +
          '<button class="json-toggle-btn' + (mode === "pretty" ? " active" : "") + '" type="button" onclick="toggleOpusPlanView(\'' + esc(planId) + '\',\'pretty\')">Pretty</button>' +
          '<button class="json-toggle-btn' + (mode === "raw" ? " active" : "") + '" type="button" onclick="toggleOpusPlanView(\'' + esc(planId) + '\',\'raw\')">Raw</button>' +
        '</div></div>';
      let content;
      if (mode === "raw") {
        let formatted;
        try { formatted = JSON.stringify(JSON.parse(raw), null, 2); } catch (e) { formatted = raw; }
        content = '<div class="detail-card" style="white-space:pre-wrap;font-size:12px;font-family:Cascadia Mono, SF Mono, Consolas, monospace;line-height:1.5;overflow-x:auto;">' + esc(formatted) + '</div>';
      } else {
        content = renderOpusPlanPretty(raw);
      }
      return '<div class="detail-section">' + toggleHtml + '<div style="margin-top:10px;">' + content + '</div></div>';
    }

    function renderOpusPlanPretty(raw) {
      let data;
      try { data = JSON.parse(raw); } catch (e) { return '<div class="detail-card" style="white-space:pre-wrap;font-size:13px;">' + esc(raw) + '</div>'; }
      let html = '<div class="detail-card opus-plan-pretty">';
      if (data.plan_summary) html += '<div class="op-summary">' + esc(data.plan_summary) + '</div>';
      if (data.tasks && data.tasks.length) {
        html += '<div class="detail-section-title" style="margin-bottom:8px;">Tasks (' + data.tasks.length + ')</div>';
        data.tasks.forEach(function(task, i) {
          html += '<div class="op-task">';
          html += '<div class="op-task-title">' + (i + 1) + '. ' + esc(task.title) + '</div>';
          if (task.slug) html += '<div class="op-task-slug">' + esc(task.slug) + '</div>';
          if (task.description) html += '<div class="op-task-desc">' + esc(task.description) + '</div>';
          if (task.depends_on && task.depends_on.length) html += '<div class="op-task-deps">Depends on: ' + task.depends_on.map(esc).join(", ") + '</div>';
          html += '</div>';
        });
      }
      html += '</div>';
      return html;
    }

    function toggleOpusPlanView(planId, mode) {
      opusPlanViewMode[planId] = mode;
      renderPlansView();
    }

    async function approvePlan(id) { await api("POST", "/api/plans/" + id + "/approve"); await loadPlans(); }
    async function rejectPlan(id) { await api("POST", "/api/plans/" + id + "/reject"); await loadPlans(); }

    async function renderTasks() {
      if (!plans.length) await loadPlans();
      const container = document.getElementById("view-container");
      const planOpts = plans.map(plan =>
        '<option value="' + esc(plan.id) + '"' + (selectedPlanId === plan.id ? " selected" : "") + '>' +
        esc(plan.projectName) + ": " + esc(plan.spec).slice(0, 56) + '</option>'
      ).join("");

      container.innerHTML =
        '<div class="master-panel">' +
          '<div class="master-header"><div class="master-title">Tasks</div>' +
          '<button class="btn btn-compact" type="button" onclick="renderTasks()">Refresh</button></div>' +
          '<div style="padding:12px 20px;border-bottom:1px solid var(--border-subtle);"><label>Plan</label>' +
          '<select id="task-plan-select" onchange="onTaskPlanChange()">' + planOpts + '</select></div>' +
          '<div class="master-list" id="tasks-master-list"></div>' +
        '</div><div class="detail-panel" id="task-detail-panel"><div class="detail-empty">Select a task</div></div>';

      const planId = selectedPlanId || plans[0]?.id;
      if (planId) {
        selectedPlanId = planId;
        await loadTasksForPlan(planId);
      } else {
        document.getElementById("tasks-master-list").innerHTML = '<div class="empty-list">No plans</div>';
      }
    }

    function onTaskPlanChange() {
      selectedPlanId = document.getElementById("task-plan-select").value;
      selectedTaskId = null;
      loadTasksForPlan(selectedPlanId);
    }

    async function loadTasksForPlan(planId) {
      currentTasks = await api("GET", "/api/plans/" + planId + "/tasks");
      const list = document.getElementById("tasks-master-list");
      if (!list) return;
      list.innerHTML = currentTasks.map(task =>
        '<button class="master-row' + (selectedTaskId === task.id ? ' selected' : '') +
        '" type="button" onclick="selectTask(\'' + esc(task.id) + '\')">' +
          '<div class="row-main"><div class="row-name">' + esc(task.title) + '</div>' +
          '<div class="row-meta">' + esc(task.branch_name) + '</div></div>' + badge(task.status) +
        '</button>'
      ).join("") || '<div class="empty-list">No tasks for this plan</div>';
    }

    function selectTask(id) {
      selectedTaskId = id;
      const task = currentTasks.find(item => item.id === id);
      document.querySelectorAll("#tasks-master-list .master-row").forEach(row => row.classList.remove("selected"));
      const rows = Array.from(document.querySelectorAll("#tasks-master-list .master-row"));
      const index = currentTasks.findIndex(item => item.id === id);
      if (rows[index]) rows[index].classList.add("selected");
      renderTaskDetail(task);
    }

    function renderTaskDetail(task) {
      const panel = document.getElementById("task-detail-panel");
      if (!panel) return;
      if (!task) {
        panel.innerHTML = '<div class="detail-empty">Task not found</div>';
        return;
      }
      const stopBtn = task.status === "in_progress" ?
        '<button class="btn btn-danger" type="button" onclick="stopTask(\'' + esc(task.id) + '\')">Stop</button>' : "";
      panel.innerHTML =
        '<div class="detail-header"><div class="detail-title">' + esc(task.title) + '</div>' +
        '<div class="detail-subtitle">' + esc(task.branch_name) + '</div></div>' +
        '<div class="detail-content">' +
          '<div class="detail-section"><div class="detail-section-title">Configuration</div><div class="detail-card">' +
          '<div class="detail-field"><span class="field-label">Status</span><span class="field-value">' + badge(task.status) + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Attempt</span><span class="field-value">' + esc(task.attempt) + '</span></div>' +
          '<div class="detail-field"><span class="field-label">PR</span><span class="field-value">' +
          (task.pr_url ? '<a href="' + esc(task.pr_url) + '" target="_blank" rel="noreferrer">View PR</a>' : "-") + '</span></div>' +
          '<div class="detail-field"><span class="field-label">Updated</span><span class="field-value">' + esc(task.updated_at) + '</span></div>' +
          '</div></div>' +
          (task.description ? '<div class="detail-section"><div class="detail-section-title">Description</div>' +
          '<div class="detail-card" style="white-space:pre-wrap;font-size:13px;line-height:1.6;">' + esc(task.description) + '</div></div>' : "") +
          (task.review_feedback ? '<div class="detail-section"><div class="detail-section-title">Review Feedback</div>' +
          '<div class="detail-card" style="white-space:pre-wrap;font-size:12px;font-family:Cascadia Mono, SF Mono, Consolas, monospace;line-height:1.5;">' + esc(task.review_feedback) + '</div></div>' : "") +
        '</div><div class="detail-actions">' + stopBtn +
        '<button class="btn" type="button" onclick="viewTaskLogs(\'' + esc(task.id) + '\')">View Logs</button></div>';
    }

    async function stopTask(id) {
      await api("POST", "/api/tasks/" + id + "/stop");
      await loadTasksForPlan(selectedPlanId);
      document.getElementById("task-detail-panel").innerHTML = '<div class="detail-empty">Select a task</div>';
    }

    function viewTaskLogs(taskId) {
      switchView("logs");
      setTimeout(() => connectTaskLogs(taskId), 100);
    }

    function renderLogs() {
      const container = document.getElementById("view-container");
      container.innerHTML =
        '<div class="master-panel">' +
          '<div class="master-header"><div class="master-title">Log Sources</div>' +
          '<button class="btn btn-compact" type="button" onclick="renderLogs()">Refresh</button></div>' +
          '<div class="master-list">' +
            '<button class="master-row selected" type="button" onclick="connectEvents()">' +
              '<div class="row-main"><div class="row-name">System Events</div><div class="row-meta">SSE</div></div>' +
            '</button>' + buildTaskLogSources() +
          '</div>' +
        '</div><div class="detail-panel">' +
          '<div class="detail-header" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
            '<div><div class="detail-title" id="log-title">System Events</div><div class="detail-subtitle">Server-sent event stream</div></div>' +
            '<button class="btn btn-compact" type="button" onclick="connectEvents()">Reconnect</button>' +
          '</div>' +
          '<div style="flex:1;overflow:hidden;padding:12px 24px 24px;"><div id="log-output" class="log"></div></div>' +
        '</div>';
      connectEvents();
    }

    function buildTaskLogSources() {
      return currentTasks
        .filter(task => task.status === "in_progress" || task.status === "reviewing")
        .map(task =>
          '<button class="master-row" type="button" onclick="connectTaskLogs(\'' + esc(task.id) + '\')">' +
            '<div class="row-main"><div class="row-name">' + esc(task.title) + '</div><div class="row-meta">' + esc(task.branch_name) + '</div></div>' +
            badge(task.status) +
          '</button>'
        ).join("");
    }

    function appendLog(line) {
      const log = document.getElementById("log-output");
      if (!log) return;
      log.textContent += line + "\n";
      log.scrollTop = log.scrollHeight;
    }

    function connectEvents() {
      const title = document.getElementById("log-title");
      if (title) title.textContent = "System Events";
      openSse("/api/events?token=" + encodeURIComponent(ensureToken()));
    }

    function connectTaskLogs(taskId) {
      const task = currentTasks.find(item => item.id === taskId);
      const title = document.getElementById("log-title");
      if (title) title.textContent = task ? task.title : "Task Logs";
      openSse("/api/tasks/" + taskId + "/logs?token=" + encodeURIComponent(ensureToken()));
    }

    function openSse(path) {
      if (eventSource) eventSource.close();
      const logEl = document.getElementById("log-output");
      if (logEl) logEl.textContent = "";
      eventSource = new EventSource(API + path);
      eventSource.onopen = () => appendLog("connected");
      eventSource.onerror = () => appendLog("connection error");
      eventSource.onmessage = event => appendLog(event.data);
      ["plan_activated", "agent_dispatched", "review_completed", "improvement_proposed",
       "task_completed", "task_failed", "task_retry", "opus_queued", "log", "agent_log"].forEach(type => {
        eventSource.addEventListener(type, event => appendLog("[" + type + "] " + event.data));
      });
    }

    async function loadDashboard(options = {}) {
      await loadProjects();
      await loadPlans();
      const activePlans = plans.filter(plan => plan.status === "active");
      const pendingPlans = plans.filter(plan => plan.status === "pending");
      const completedPlans = plans.filter(plan => plan.status === "completed").slice(0, 5);
      const plansToLoad = [...activePlans, ...pendingPlans, ...completedPlans];
      const currentPlanIds = new Set(plansToLoad.map(plan => String(plan.id)));
      for (const planId of Object.keys(dashboardTasks)) {
        if (!currentPlanIds.has(String(planId))) delete dashboardTasks[planId];
      }

      for (const plan of plansToLoad) {
        try {
          dashboardTasks[plan.id] = await api("GET", "/api/plans/" + plan.id + "/tasks");
        } catch (error) {
          dashboardTasks[plan.id] = [];
        }
      }

      renderDashboard();
      if (!options.skipSseReconnect) connectDashboardSse();
    }

    function renderDashboard() {
      const activePendingPlans = plans.filter(plan => plan.status === "active" || plan.status === "pending");
      const completedPlans = plans.filter(plan => plan.status === "completed").slice(0, 5);
      const attentionCount = plans.filter(plan => plan.status === "pending").length +
        Object.values(dashboardTasks).flat().filter(task => task.status === "failed").length;
      const lanesHtml = activePendingPlans.map(renderSwimLane).join("");
      const completedHtml = completedPlans.length ? completedPlans.map(renderCompletedLane).join("") : "";
      const bodyHtml = activePendingPlans.length ?
        lanesHtml + completedHtml :
        '<div class="dashboard-idle"><div>No active plans right now</div><div style="font-size:12px;margin-top:8px;">Submit a spec to start orchestration.</div></div>' +
        completedHtml;
      const container = document.getElementById("view-container");
      container.innerHTML =
        renderHealthBar(attentionCount) +
        '<div class="dashboard-body">' +
          '<div class="dashboard-lanes">' + bodyHtml + '</div>' +
          '<div class="side-panel" id="dashboard-side-panel"></div>' +
        '</div>';
      if (selectedDashboardTaskId) {
        const selectedTask = Object.values(dashboardTasks).flat().find(task => task.id === selectedDashboardTaskId);
        if (selectedTask) {
          openDashboardTask(selectedTask.id, selectedTask.plan_id);
        } else {
          selectedDashboardTaskId = null;
        }
      }
    }

    function renderHealthBar(attentionCount) {
      const agentDot = document.getElementById("agent-dot");
      const agentCount = Number(document.getElementById("stat-agents")?.textContent || 0);
      const queueCount = Number(document.getElementById("stat-queue")?.textContent || 0);
      let opusStatus = "unknown";
      if (agentDot && agentDot.classList.contains("rate_limited")) opusStatus = "rate_limited";
      if (agentDot && agentDot.classList.contains("connected")) opusStatus = "available";
      if (agentDot && agentDot.classList.contains("disconnected")) opusStatus = "resuming";
      const attentionBadge = attentionCount > 0 ? '<span class="health-attention">' + attentionCount + ' needs attention</span>' : "";
      return '<div class="health-bar">' +
        '<div class="health-item"><span class="health-dot ' + esc(opusStatus) + '"></span><span>Opus ' + esc(opusStatus.replace("_", " ")) + '</span></div>' +
        '<div class="health-item"><span>Agents: ' + esc(agentCount) + '</span></div>' +
        '<div class="health-item"><span>Queue: ' + esc(queueCount) + '</span></div>' +
        '<span class="health-spacer"></span>' + attentionBadge +
      '</div>';
    }

    function renderSwimLane(plan) {
      const tasks = (dashboardTasks[plan.id] || []).slice();
      const statusOrder = { merged: 0, passed: 1, reviewing: 2, in_progress: 3, failed: 4, pending: 5 };
      tasks.sort((a, b) => (statusOrder[a.status] ?? 99) - (statusOrder[b.status] ?? 99));
      const isSpecExpanded = expandedSpecs.has(plan.id);
      const specPreview = esc(plan.spec).slice(0, 80);
      const approvalActions = (plan.status === "pending" && plan.source === "autonomous") ?
        '<button class="btn btn-compact btn-primary" type="button" onclick="dashboardApprove(\'' + esc(plan.id) + '\')">Approve</button>' +
        '<button class="btn btn-compact btn-danger" type="button" onclick="dashboardReject(\'' + esc(plan.id) + '\')">Reject</button>' : "";
      const taskCards = tasks.length ? tasks.map(renderTaskCard).join("") :
        '<div class="card-meta" style="padding:2px 0;">Planning in progress - task cards will appear shortly.</div>';
      return '<section class="swim-lane">' +
        '<div class="lane-header">' +
          badge(plan.status) +
          '<div class="lane-spec">' + specPreview + '</div>' +
          '<div class="lane-meta">' + esc(plan.projectName || "unknown") + " - " + esc(plan.plan_branch_name || "-") + '</div>' +
          '<button class="btn btn-compact" type="button" onclick="toggleSpec(\'' + esc(plan.id) + '\')">' + (isSpecExpanded ? "Hide Spec" : "View Spec") + '</button>' +
          approvalActions +
        '</div>' +
        (isSpecExpanded ? '<div class="lane-spec-full">' + esc(plan.spec) + '</div>' : "") +
        '<div class="lane-cards">' + taskCards + '</div>' +
      '</section>';
    }

    function renderTaskCard(task) {
      const isSelected = selectedDashboardTaskId === task.id;
      const isPulsing = task.status === "in_progress" || task.status === "reviewing";
      const pulseClass = task.status === "reviewing" ? "amber" : "green";
      const retryAction = task.status === "failed" ?
        '<button class="btn btn-compact btn-danger" type="button" onclick="event.stopPropagation();dashboardRetry(' + jsArg(task.id) + ')">Retry</button>' : "";
      const prHref = task.pr_url ? safeHref(task.pr_url) : "";
      const prLink = prHref ?
        '<a href="' + prHref + '" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">PR</a>' : "";
      const logLine = dashboardTaskLogs[task.id] ? '<div class="card-log-line">' + esc(dashboardTaskLogs[task.id]) + '</div>' : "";
      return '<article class="task-card status-' + esc(task.status) + (isSelected ? " selected" : "") +
        '" data-task-id="' + esc(task.id) + '" onclick="openDashboardTask(' + jsArg(task.id) + ',' + jsArg(task.plan_id) + ')">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
          badge(task.status) +
          (isPulsing ? '<span class="pulse-dot ' + pulseClass + '"></span>' : "") +
        '</div>' +
        '<div class="card-title">' + esc(task.title) + '</div>' +
        '<div class="card-meta">' + esc(task.branch_name || "-") + '</div>' +
        '<div class="card-meta" style="display:flex;align-items:center;gap:8px;margin-top:6px;">' + retryAction + prLink + '</div>' +
        logLine +
      '</article>';
    }

    function renderCompletedLane(plan) {
      const isExpanded = expandedCompletedPlans.has(plan.id);
      const tasks = dashboardTasks[plan.id] || [];
      const mergedCount = tasks.filter(task => task.status === "merged").length;
      const specPreview = esc(plan.spec).slice(0, 80);
      return '<section class="swim-lane completed-lane' + (isExpanded ? " expanded" : "") + '">' +
        '<div class="completed-header" onclick="toggleCompletedPlan(\'' + esc(plan.id) + '\')">' +
          '<span class="disclosure' + (isExpanded ? " open" : "") + '">></span>' +
          '<span class="badge completed">completed</span>' +
          '<span class="lane-spec">' + specPreview + '</span>' +
          '<span class="completed-meta">' + mergedCount + "/" + tasks.length + ' merged</span>' +
          '<span class="completed-meta">' + esc(timeAgo(plan.created_at)) + '</span>' +
        '</div>' +
        (isExpanded ? '<div class="lane-cards">' + (tasks.length ? tasks.map(renderTaskCard).join("") : '<div class="card-meta">No tasks</div>') + '</div>' : "") +
      '</section>';
    }

    function timeAgo(isoString) {
      if (!isoString) return "-";
      const then = new Date(isoString).getTime();
      if (Number.isNaN(then)) return "-";
      const seconds = Math.max(0, Math.floor((Date.now() - then) / 1000));
      if (seconds < 60) return seconds + "s ago";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + "m ago";
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      return days + "d ago";
    }

    function openDashboardTask(taskId, planId) {
      const task = (dashboardTasks[planId] || []).find(item => item.id === taskId);
      if (!task) {
        selectedDashboardTaskId = null;
        document.querySelectorAll(".task-card").forEach(el => el.classList.remove("selected"));
        return;
      }
      selectedDashboardTaskId = taskId;
      document.querySelectorAll(".task-card").forEach(el => {
        el.classList.toggle("selected", el.dataset.taskId === taskId);
      });
      renderSidePanel(task);
    }

    function renderSidePanel(task) {
      const panel = document.getElementById("dashboard-side-panel");
      if (!panel) return;
      const stopBtn = task.status === "in_progress" ?
        '<button class="btn btn-danger" type="button" onclick="dashboardStop(' + jsArg(task.id) + ')">Stop</button>' : "";
      const retryBtn = task.status === "failed" ?
        '<button class="btn btn-danger" type="button" onclick="dashboardRetry(' + jsArg(task.id) + ')">Retry</button>' : "";
      const logsBtn = '<button class="btn" type="button" onclick="viewTaskLogs(' + jsArg(task.id) + ')">View Full Logs</button>';
      const panelPrHref = task.pr_url ? safeHref(task.pr_url) : "";
      panel.innerHTML =
        '<div class="side-panel-header">' +
          '<div class="side-panel-title-wrap">' +
            '<div class="side-panel-title">' + esc(task.title) + '</div>' +
            '<div class="side-panel-branch">' + esc(task.branch_name || "-") + '</div>' +
          '</div>' +
          '<button class="side-panel-close" type="button" onclick="closeDashboardPanel()">x</button>' +
        '</div>' +
        '<div class="side-panel-content">' +
          '<div class="side-panel-section">' +
            '<div class="side-panel-section-title">Details</div>' +
            '<div class="side-panel-field"><span>Status</span><span>' + badge(task.status) + '</span></div>' +
            '<div class="side-panel-field"><span>Attempt</span><span>' + esc(task.attempt) + '</span></div>' +
            '<div class="side-panel-field"><span>PR</span><span>' + (panelPrHref ? '<a href="' + panelPrHref + '" target="_blank" rel="noreferrer">View PR</a>' : "-") + '</span></div>' +
            '<div class="side-panel-field"><span>Created</span><span>' + esc(task.created_at || "-") + '</span></div>' +
            '<div class="side-panel-field"><span>Updated</span><span>' + esc(task.updated_at || "-") + '</span></div>' +
          '</div>' +
          (task.description ? '<div class="side-panel-section"><div class="side-panel-section-title">Description</div><div class="side-panel-block">' + esc(task.description) + '</div></div>' : "") +
          (task.review_feedback ? '<div class="side-panel-section"><div class="side-panel-section-title">Review Feedback</div><div class="side-panel-block">' + esc(task.review_feedback) + '</div></div>' : "") +
          '<div class="side-panel-section"><div class="side-panel-section-title">Live Log</div><div class="side-panel-log" id="dashboard-log-tail"></div></div>' +
        '</div>' +
        '<div class="side-panel-actions">' + stopBtn + retryBtn + logsBtn + '</div>';
      panel.classList.add("open");
    }

    function closeDashboardPanel() {
      selectedDashboardTaskId = null;
      const panel = document.getElementById("dashboard-side-panel");
      if (panel) {
        panel.classList.remove("open");
        panel.innerHTML = "";
      }
      document.querySelectorAll(".task-card").forEach(el => el.classList.remove("selected"));
    }

    async function dashboardStop(taskId) {
      await api("POST", "/api/tasks/" + taskId + "/stop");
      const owningPlan = Object.entries(dashboardTasks).find(([, tasks]) => tasks.some(task => task.id === taskId));
      if (owningPlan) {
        const planId = owningPlan[0];
        dashboardTasks[planId] = await api("GET", "/api/plans/" + planId + "/tasks");
      }
      closeDashboardPanel();
      renderDashboard();
    }

    function connectDashboardSse() {
      if (dashboardSseSource && dashboardSseSource !== eventSource) {
        dashboardSseSource.close();
      }
      if (eventSource) eventSource.close();

      const source = new EventSource(API + "/api/events?token=" + encodeURIComponent(ensureToken()));
      eventSource = source;
      dashboardSseSource = source;

      source.onerror = () => {
        const healthBar = document.querySelector(".health-bar");
        if (!healthBar || healthBar.querySelector(".reconnecting")) return;
        const reconnecting = document.createElement("span");
        reconnecting.className = "reconnecting";
        reconnecting.style.cssText = "color:var(--badge-reviewing-text);font-size:11px;";
        reconnecting.textContent = "reconnecting...";
        healthBar.appendChild(reconnecting);
      };

      source.onopen = () => {
        const reconnecting = document.querySelector(".health-bar .reconnecting");
        if (reconnecting) reconnecting.remove();
      };

      source.addEventListener("agent_log", event => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (error) {
          return;
        }

        const taskId = data?.task_id;
        if (!taskId) return;

        const logText = String(data.logs || data.line || "");
        const lines = logText.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        if (lines.length) dashboardTaskLogs[taskId] = lines[lines.length - 1];

        document.querySelectorAll(".task-card").forEach(card => {
          if (card.dataset.taskId !== String(taskId)) return;
          let logLineEl = card.querySelector(".card-log-line");
          if (!logLineEl) {
            logLineEl = document.createElement("div");
            logLineEl.className = "card-log-line";
            card.appendChild(logLineEl);
          }
          logLineEl.textContent = dashboardTaskLogs[taskId] || "";
        });

        if (String(selectedDashboardTaskId) === String(taskId)) {
          const logTail = document.getElementById("dashboard-log-tail");
          if (!logTail) return;
          logTail.textContent += logText + "\n";
          logTail.scrollTop = logTail.scrollHeight;
        }
      });

      ["plan_activated", "agent_dispatched", "review_completed", "task_completed", "task_failed", "task_retry", "improvement_proposed"].forEach(type => {
        source.addEventListener(type, () => {
          if (currentView === "dashboard") void loadDashboard({ skipSseReconnect: true });
        });
      });

      source.addEventListener("opus_queued", event => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (error) {
          return;
        }
        if (data?.queued_count != null) {
          document.getElementById("stat-queue").textContent = String(data.queued_count);
        }
      });
    }

    function toggleSpec(planId) {
      if (expandedSpecs.has(planId)) expandedSpecs.delete(planId); else expandedSpecs.add(planId);
      renderDashboard();
    }

    function toggleCompletedPlan(planId) {
      if (expandedCompletedPlans.has(planId)) expandedCompletedPlans.delete(planId); else expandedCompletedPlans.add(planId);
      renderDashboard();
    }

    async function dashboardApprove(planId) {
      await api("POST", "/api/plans/" + planId + "/approve");
      await loadPlans();
      await loadDashboard();
    }

    async function dashboardReject(planId) {
      await api("POST", "/api/plans/" + planId + "/reject");
      await loadPlans();
      await loadDashboard();
    }

    async function dashboardRetry(taskId) {
      await api("POST", "/api/tasks/" + taskId + "/retry");
      const owningPlan = Object.entries(dashboardTasks).find(([, tasks]) => tasks.some(task => task.id === taskId));
      if (owningPlan) {
        const planId = owningPlan[0];
        dashboardTasks[planId] = await api("GET", "/api/plans/" + planId + "/tasks");
      }
      renderDashboard();
    }

    async function pollStatus() {
      if (!token) return;
      try {
        const status = await api("GET", "/api/status");
        document.getElementById("stat-agents").textContent = status.active_agents;
        document.getElementById("stat-queue").textContent = status.opus_state.queued_count;
        setConnection("agent", status.agent_model, status.opus_state.status);
        setConnection("subagent", status.subagent_model, status.subagent_model.connected ? "connected" : "disconnected");
      } catch (error) {
        setConnection("agent", { name: "offline", connected: false }, "disconnected");
        setConnection("subagent", { name: "offline", connected: false }, "disconnected");
      }
    }

    function setConnection(prefix, info, status) {
      const dot = document.getElementById(prefix + "-dot");
      const model = document.getElementById(prefix + "-model");
      const connected = info && info.connected;
      dot.className = "conn-dot " + (status === "rate_limited" ? "rate_limited" : connected ? "connected" : "disconnected");
      model.textContent = info && info.name ? info.name : "unknown";
    }

    ensureToken();
    switchView("dashboard").catch(error => {
      document.getElementById("view-container").innerHTML =
        '<div class="detail-empty" style="padding:40px;text-align:center;">' +
        '<div style="margin-bottom:8px;font-weight:700;">Connection failed</div>' +
        '<div style="color:var(--text-muted);font-size:12px;margin-bottom:16px;">' + esc(error.message) + '</div>' +
        '<button class="btn btn-primary" type="button" onclick="switchView(\'dashboard\')">Retry</button></div>';
    });
    pollStatus();
    window.setInterval(pollStatus, 5000);
  </script>
</body>
</html>
