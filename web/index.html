<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #181c20;
      --panel-2: #20262b;
      --line: #303840;
      --text: #edf1f4;
      --muted: #9ba7b0;
      --teal: #2aa889;
      --blue: #4f8cc9;
      --amber: #d69332;
      --red: #d85b5b;
      --green: #58b06f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    header {
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      background: #15191d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 20px; font-weight: 700; }
    h2 { font-size: 16px; font-weight: 650; margin-bottom: 14px; }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      padding: 0 13px;
      background: var(--teal);
      color: #fff;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover { filter: brightness(1.08); }
    button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
    button.danger { background: var(--red); }
    button.success { background: var(--green); }
    button.compact { min-height: 30px; padding: 0 9px; font-size: 12px; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101417;
      color: var(--text);
      padding: 9px 10px;
    }

    textarea { min-height: 132px; resize: vertical; line-height: 1.45; }
    label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    a { color: #7eb6e8; }

    .statusbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--muted);
    }

    .dot.available { background: var(--green); }
    .dot.rate_limited { background: var(--amber); }
    .dot.resuming { background: var(--blue); }

    main { max-width: 1280px; margin: 0 auto; padding: 22px; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border-radius: 6px 6px 0 0;
      border: 1px solid transparent;
      border-bottom: 0;
      background: transparent;
      color: var(--muted);
      min-width: 96px;
    }

    .tab.active {
      color: var(--text);
      background: var(--panel);
      border-color: var(--line);
    }

    .grid { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 16px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .formrow { margin-bottom: 12px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .hidden { display: none; }

    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 650; }
    tr:last-child td { border-bottom: 0; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 4px;
      padding: 0 7px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--panel-2);
      color: var(--muted);
    }

    .badge.pending { color: #b7c7ff; background: #273050; }
    .badge.active, .badge.in_progress { color: #b9ddff; background: #22384d; }
    .badge.reviewing { color: #ffd79c; background: #4c3920; }
    .badge.completed, .badge.passed, .badge.merged { color: #bcf2c8; background: #21462c; }
    .badge.failed, .badge.rejected { color: #ffc2c2; background: #4c2424; }

    .log {
      min-height: 520px;
      max-height: 66vh;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #090b0d;
      color: #d7e5dd;
      padding: 12px;
      line-height: 1.45;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .split { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }

    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; padding: 14px 16px; }
      main { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .tabs { overflow-x: auto; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Praxis</h1>
    <div class="statusbar">
      <span><span id="opus-dot" class="dot"></span><span id="opus-status">opus</span></span>
      <span>agents <strong id="agent-count">0</strong></span>
      <span>queue <strong id="queue-count">0</strong></span>
      <button class="secondary compact" type="button" onclick="resetToken()">Token</button>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Views">
      <button class="tab active" type="button" data-tab="projects" onclick="showTab(event, 'projects')">Projects</button>
      <button class="tab" type="button" data-tab="plans" onclick="showTab(event, 'plans')">Plans</button>
      <button class="tab" type="button" data-tab="tasks" onclick="showTab(event, 'tasks')">Tasks</button>
      <button class="tab" type="button" data-tab="logs" onclick="showTab(event, 'logs')">Logs</button>
    </nav>

    <section id="tab-projects">
      <div class="grid">
        <form class="panel" onsubmit="addProject(event)">
          <h2>Add Project</h2>
          <div class="formrow">
            <label for="project-name">Name</label>
            <input id="project-name" required autocomplete="off">
          </div>
          <div class="formrow">
            <label for="project-repo">Repository URL</label>
            <input id="project-repo" required autocomplete="off" placeholder="https://github.com/user/repo">
          </div>
          <div class="formrow">
            <label for="project-model">Model</label>
            <input id="project-model" required autocomplete="off" value="deepseek-coder-v2">
          </div>
          <button type="submit">Add</button>
        </form>

        <div class="panel">
          <h2>Projects</h2>
          <table>
            <thead><tr><th>Name</th><th>Repository</th><th>Gate</th><th></th></tr></thead>
            <tbody id="projects-list"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="tab-plans" class="hidden">
      <div class="grid">
        <form class="panel" onsubmit="submitPlan(event)">
          <h2>Submit Spec</h2>
          <div class="formrow">
            <label for="plan-project">Project</label>
            <select id="plan-project" required></select>
          </div>
          <div class="formrow">
            <label for="plan-spec">Specification</label>
            <textarea id="plan-spec" required></textarea>
          </div>
          <button type="submit">Submit</button>
        </form>

        <div class="panel">
          <h2>Plans</h2>
          <table>
            <thead><tr><th>Spec</th><th>Source</th><th>Status</th><th>Confidence</th><th></th></tr></thead>
            <tbody id="plans-list"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="tab-tasks" class="hidden">
      <div class="panel">
        <div class="split">
          <div>
            <h2>Tasks</h2>
            <label for="task-plan">Plan</label>
            <select id="task-plan" onchange="loadTasks()"></select>
          </div>
          <button class="secondary" type="button" onclick="loadTasks()">Refresh</button>
        </div>
        <table>
          <thead><tr><th>Title</th><th>Branch</th><th>Status</th><th>Attempt</th><th>PR</th><th></th></tr></thead>
          <tbody id="tasks-list"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-logs" class="hidden">
      <div class="panel">
        <div class="split">
          <h2>Live Events</h2>
          <button class="secondary" type="button" onclick="connectEvents()">Reconnect</button>
        </div>
        <div id="log-output" class="log"></div>
      </div>
    </section>
  </main>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem("praxis_token") || "";
    let eventSource = null;
    let projects = [];
    let plans = [];

    function ensureToken() {
      if (!token) resetToken();
      return token;
    }

    function resetToken() {
      token = window.prompt("API token", token) || "";
      localStorage.setItem("praxis_token", token);
      pollStatus();
    }

    function headers() {
      return {
        "Authorization": `Bearer ${ensureToken()}`,
        "Content-Type": "application/json"
      };
    }

    async function api(method, path, body) {
      const options = { method, headers: headers() };
      if (body !== undefined) options.body = JSON.stringify(body);
      const response = await fetch(`${API}${path}`, options);
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    function text(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function badge(status) {
      return `<span class="badge ${text(status)}">${text(status)}</span>`;
    }

    function showTab(event, name) {
      document.querySelectorAll("section[id^='tab-']").forEach(el => el.classList.add("hidden"));
      document.getElementById(`tab-${name}`).classList.remove("hidden");
      document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
      event.currentTarget.classList.add("active");
      if (name === "projects") loadProjects();
      if (name === "plans") loadPlans();
      if (name === "tasks") loadPlans().then(loadTasks);
      if (name === "logs") connectEvents();
    }

    async function addProject(event) {
      event.preventDefault();
      await api("POST", "/api/projects", {
        name: document.getElementById("project-name").value,
        repo_url: document.getElementById("project-repo").value,
        model_name: document.getElementById("project-model").value
      });
      event.target.reset();
      document.getElementById("project-model").value = "deepseek-coder-v2";
      await loadProjects();
    }

    async function loadProjects() {
      projects = await api("GET", "/api/projects");
      document.getElementById("projects-list").innerHTML = projects.map(project => `
        <tr>
          <td>${text(project.name)}</td>
          <td><a href="${text(project.repo_url)}" target="_blank" rel="noreferrer">${text(project.repo_url)}</a></td>
          <td>${project.approval_gate ? "on" : "off"}</td>
          <td><button class="compact secondary" type="button" onclick="selectProject('${text(project.id)}')">Select</button></td>
        </tr>
      `).join("") || `<tr><td colspan="4" class="muted">No projects</td></tr>`;
      document.getElementById("plan-project").innerHTML = projects.map(project =>
        `<option value="${text(project.id)}">${text(project.name)}</option>`
      ).join("");
    }

    function selectProject(id) {
      document.querySelector("[data-tab='plans']").click();
      document.getElementById("plan-project").value = id;
    }

    async function submitPlan(event) {
      event.preventDefault();
      const projectId = document.getElementById("plan-project").value;
      await api("POST", `/api/projects/${projectId}/plans`, {
        spec: document.getElementById("plan-spec").value
      });
      document.getElementById("plan-spec").value = "";
      await loadPlans();
    }

    async function loadPlans() {
      if (projects.length === 0) await loadProjects();
      plans = [];
      for (const project of projects) {
        const projectPlans = await api("GET", `/api/projects/${project.id}/plans`);
        plans.push(...projectPlans.map(plan => ({ ...plan, projectName: project.name })));
      }
      document.getElementById("plans-list").innerHTML = plans.map(plan => `
        <tr>
          <td>${text(plan.spec)}</td>
          <td>${text(plan.source)}</td>
          <td>${badge(plan.status)}</td>
          <td>${plan.confidence == null ? "-" : `${Math.round(plan.confidence * 100)}%`}</td>
          <td class="actions">${plan.status === "pending" && plan.source === "autonomous" ? `
            <button class="compact success" type="button" onclick="approvePlan('${text(plan.id)}')">Approve</button>
            <button class="compact danger" type="button" onclick="rejectPlan('${text(plan.id)}')">Reject</button>
          ` : ""}</td>
        </tr>
      `).join("") || `<tr><td colspan="5" class="muted">No plans</td></tr>`;
      document.getElementById("task-plan").innerHTML = plans.map(plan =>
        `<option value="${text(plan.id)}">${text(plan.projectName)}: ${text(plan.spec).slice(0, 60)}</option>`
      ).join("");
    }

    async function approvePlan(id) {
      await api("POST", `/api/plans/${id}/approve`);
      await loadPlans();
    }

    async function rejectPlan(id) {
      await api("POST", `/api/plans/${id}/reject`);
      await loadPlans();
    }

    async function loadTasks() {
      const planId = document.getElementById("task-plan").value;
      if (!planId) {
        document.getElementById("tasks-list").innerHTML = `<tr><td colspan="6" class="muted">No plan selected</td></tr>`;
        return;
      }
      const tasks = await api("GET", `/api/plans/${planId}/tasks`);
      document.getElementById("tasks-list").innerHTML = tasks.map(task => `
        <tr>
          <td>${text(task.title)}</td>
          <td>${text(task.branch_name)}</td>
          <td>${badge(task.status)}</td>
          <td>${text(task.attempt)}</td>
          <td>${task.pr_url ? `<a href="${text(task.pr_url)}" target="_blank" rel="noreferrer">PR</a>` : "-"}</td>
          <td class="actions">
            ${task.status === "in_progress" ? `<button class="compact danger" type="button" onclick="stopTask('${text(task.id)}')">Stop</button>` : ""}
            <button class="compact secondary" type="button" onclick="connectTaskLogs('${text(task.id)}')">Logs</button>
          </td>
        </tr>
      `).join("") || `<tr><td colspan="6" class="muted">No tasks</td></tr>`;
    }

    async function stopTask(id) {
      await api("POST", `/api/tasks/${id}/stop`);
      await loadTasks();
    }

    function appendLog(line) {
      const log = document.getElementById("log-output");
      log.textContent += `${line}\n`;
      log.scrollTop = log.scrollHeight;
    }

    function connectEvents() {
      openSse(`/api/events?token=${encodeURIComponent(ensureToken())}`);
    }

    function connectTaskLogs(taskId) {
      document.querySelector("[data-tab='logs']").click();
      openSse(`/api/tasks/${taskId}/logs?token=${encodeURIComponent(ensureToken())}`);
    }

    function openSse(path) {
      if (eventSource) eventSource.close();
      document.getElementById("log-output").textContent = "";
      eventSource = new EventSource(`${API}${path}`);
      eventSource.onopen = () => appendLog("connected");
      eventSource.onerror = () => appendLog("connection error");
      eventSource.onmessage = event => appendLog(event.data);
      ["plan_activated", "agent_dispatched", "review_completed", "improvement_proposed",
       "task_completed", "task_failed", "task_retry", "opus_queued", "log", "agent_log"].forEach(type => {
        eventSource.addEventListener(type, event => appendLog(`[${type}] ${event.data}`));
      });
    }

    async function pollStatus() {
      if (!token) return;
      try {
        const status = await api("GET", "/api/status");
        const opus = status.opus_state.status;
        const dot = document.getElementById("opus-dot");
        dot.className = `dot ${opus}`;
        document.getElementById("opus-status").textContent = opus;
        document.getElementById("agent-count").textContent = status.active_agents;
        document.getElementById("queue-count").textContent = status.opus_state.queued_count;
      } catch (error) {
        document.getElementById("opus-status").textContent = "offline";
      }
    }

    ensureToken();
    loadProjects().catch(error => appendLog(error.message));
    pollStatus();
    window.setInterval(pollStatus, 5000);
  </script>
</body>
</html>
