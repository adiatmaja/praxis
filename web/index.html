<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Praxis <span>orchestrator</span></div>
    </div>
    <nav class="sidebar-nav" aria-label="Views">
      <div class="nav-section">Workspace</div>
      <button class="nav-item active" type="button" data-view="dashboard" onclick="switchView('dashboard')"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></span>Dashboard</button>
      <button class="nav-item" type="button" data-view="projects" onclick="switchView('projects')"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4z"/><path d="M1 4h14"/><path d="M5 4V2h6v2"/></svg></span>Projects</button>
      <button class="nav-item" type="button" data-view="plans" onclick="switchView('plans')"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="1" width="12" height="14" rx="1"/><line x1="5" y1="5" x2="11" y2="5"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="5" y1="11" x2="8" y2="11"/></svg></span>Plans</button>
      <button class="nav-item" type="button" data-view="tasks" onclick="switchView('tasks')"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4l2 2 3-3"/><line x1="8" y1="5" x2="13" y2="5"/><path d="M3 9l2 2 3-3"/><line x1="8" y1="10" x2="13" y2="10"/></svg></span>Tasks</button>
      <button class="nav-item" type="button" data-view="logs" onclick="switchView('logs')"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="14" height="12" rx="1"/><line x1="4" y1="6" x2="12" y2="6"/><line x1="4" y1="9" x2="9" y2="9"/></svg></span>Live Logs</button>
      <button class="nav-item" type="button" data-view="memory" onclick="switchView('memory')"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="5" rx="6" ry="3"/><path d="M2 5v3c0 1.66 2.69 3 6 3s6-1.34 6-3V5"/><path d="M2 8v3c0 1.66 2.69 3 6 3s6-1.34 6-3V8"/></svg></span>Memory</button>
    </nav>
    <div class="sidebar-stats">
      <div class="section-label">Stats</div>
      <div class="stat-row"><span>Projects</span><strong id="stat-projects">0</strong></div>
      <div class="stat-row"><span>Plans</span><strong id="stat-plans">0</strong></div>
      <div class="stat-row"><span>Agents</span><strong id="stat-agents">0</strong></div>
      <div class="stat-row"><span>Queue</span><strong id="stat-queue">0</strong></div>
    </div>
    <div class="sidebar-connections">
      <div class="section-label">Connections</div>
      <div class="connection-row">
        <span id="agent-dot" class="conn-dot disconnected"></span>
        <div class="conn-info">
          <div class="conn-role">Planner / Reviewer</div>
          <div id="agent-model" class="conn-model">unknown</div>
        </div>
      </div>
      <div class="connection-row">
        <span id="subagent-dot" class="conn-dot disconnected"></span>
        <div class="conn-info">
          <div class="conn-role">Implementer</div>
          <div id="subagent-model" class="conn-model">unknown</div>
        </div>
      </div>
    </div>
    <div class="sidebar-git">
      <div class="section-label">Origin</div>
      <div id="git-state-line" class="git-state-line">&#x2014;</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="topbar-title" class="topbar-title">Projects</div>
      <div class="topbar-actions">
        <select id="global-project" class="global-project-select" onchange="onGlobalProjectChange()" title="Filter by project"><option value="all">All Projects</option></select>
        <button id="primary-action" class="btn btn-primary" type="button" onclick="primaryAction()">+ New Project</button>
        <button class="btn" type="button" onclick="openSpecChat()" title="Create a new spec via chat">+ Create Spec</button>
        <button class="btn theme-btn" type="button" onclick="toggleTheme()" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="3"/>
            <line x1="8" y1="1" x2="8" y2="2.5"/>
            <line x1="8" y1="13.5" x2="8" y2="15"/>
            <line x1="1" y1="8" x2="2.5" y2="8"/>
            <line x1="13.5" y1="8" x2="15" y2="8"/>
            <line x1="2.93" y1="2.93" x2="4.05" y2="4.05"/>
            <line x1="11.95" y1="11.95" x2="13.07" y2="13.07"/>
            <line x1="2.93" y1="13.07" x2="4.05" y2="11.95"/>
            <line x1="11.95" y1="4.05" x2="13.07" y2="2.93"/>
          </svg>
        </button>
        <button class="btn theme-btn" type="button" onclick="openSettings()" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="2.25"/>
            <path d="M8 1.2l.85 1.55a5.8 5.8 0 0 1 1.62.67l1.7-.42.95 1.64-1.15 1.32c.13.55.13 1.13 0 1.68l1.15 1.32-.95 1.64-1.7-.42a5.8 5.8 0 0 1-1.62.67L8 14.8l-.85-1.55a5.8 5.8 0 0 1-1.62-.67l-1.7.42-.95-1.64 1.15-1.32a5.8 5.8 0 0 1 0-1.68L2.88 6.04l.95-1.64 1.7.42a5.8 5.8 0 0 1 1.62-.67L8 1.2z"/>
          </svg>
        </button>
        <button class="btn" type="button" onclick="resetToken()">API Token</button>
      </div>
    </header>
    <!-- Provider login banner: shown when a CLI is installed but not authenticated -->
    <div id="provider-login-banner" class="provider-login-banner" role="alert" aria-live="polite">
      <button class="provider-login-banner-dismiss" type="button" onclick="dismissProviderBanner()" title="Dismiss">✕</button>
    </div>
    <section id="view-container" class="master-detail"></section>
  </main>

  <!-- Create-Spec chat panel -->
  <div id="spec-chat-overlay" class="spec-chat-overlay" onclick="onSpecChatOverlayClick(event)">
    <div class="spec-chat-panel">
      <div class="spec-chat-header">
        <div>
          <div class="spec-chat-header-title">Create Spec</div>
          <div id="spec-chat-project-label" class="spec-chat-header-sub">No project selected</div>
        </div>
        <button class="spec-chat-close" type="button" onclick="closeSpecChat()">&#x2715;</button>
      </div>
      <div id="spec-chat-messages" class="spec-chat-messages">
        <div class="spec-chat-empty">Describe what you want to build.<br>Claude will help you shape it into a spec.</div>
      </div>
      <div class="spec-chat-footer">
        <textarea id="spec-chat-input" class="spec-chat-input" rows="2" placeholder="What should be built?" onkeydown="onSpecChatKey(event)"></textarea>
        <button id="spec-chat-send" class="btn btn-primary spec-chat-send" type="button" onclick="sendSpecChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Harness About modal -->
  <div id="harness-overlay" class="harness-overlay" onclick="onHarnessOverlayClick(event)">
    <div class="harness-modal">
      <div class="harness-modal-header">
        <div class="harness-modal-title">About Harnesses</div>
        <button class="harness-modal-close" type="button" id="harness-about-close">&#x2715;</button>
      </div>
      <div class="harness-modal-body" id="harness-about-body"></div>
      <div class="harness-modal-footer">
        <button class="btn" type="button" id="harness-about-close-footer">Close</button>
      </div>
    </div>
  </div>

  <!-- API Token modal -->
  <div id="token-overlay" class="token-overlay" onclick="onTokenOverlayClick(event)">
    <div class="token-modal">
      <div class="token-modal-header">API Token</div>
      <div class="token-modal-body">
        <label class="token-label" for="token-input">Bearer token for this Praxis instance</label>
        <div class="token-input-row">
          <input id="token-input" class="token-input" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your token" onkeydown="onTokenKey(event)" />
          <button class="btn btn-compact" type="button" id="token-eye" onclick="toggleTokenVisibility()">Show</button>
        </div>
        <div id="token-feedback" class="token-feedback"></div>
      </div>
      <div class="token-modal-footer">
        <button class="btn" type="button" onclick="clearToken()">Clear</button>
        <span style="flex:1;"></span>
        <button class="btn" type="button" onclick="closeTokenModal()">Cancel</button>
        <button class="btn btn-primary" type="button" id="token-save" onclick="saveToken()">Save &amp; verify</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-overlay" class="settings-overlay" onclick="onSettingsOverlayClick(event)">
    <div class="settings-modal">
      <div class="settings-modal-header">
        <div class="settings-modal-title">Settings</div>
        <button class="settings-modal-close" type="button" onclick="closeSettings()">&#x2715;</button>
      </div>
      <div class="settings-tabs">
        <button class="settings-tab active" type="button" id="settings-tab-global" onclick="switchSettingsTab('global')">Global</button>
        <button class="settings-tab" type="button" id="settings-tab-project" onclick="switchSettingsTab('project')">Project</button>
        <button class="settings-tab" type="button" id="settings-tab-models" onclick="switchSettingsTab('models')">Models</button>
      </div>
      <div class="settings-body">
        <!-- Global tab -->
        <div class="settings-tab-panel active" id="settings-panel-global">
          <div id="settings-global-content">
            <div style="color:var(--text-faint);font-size:13px;">Loading…</div>
          </div>
        </div>
        <!-- Project tab -->
        <div class="settings-tab-panel" id="settings-panel-project">
          <div class="settings-field-row">
            <label for="settings-project-select">Project</label>
            <select id="settings-project-select" onchange="onSettingsProjectChange()">
              <option value="">— select a project —</option>
            </select>
          </div>
          <div id="settings-project-content"></div>
        </div>
        <!-- Models tab -->
        <div class="settings-tab-panel" id="settings-panel-models"></div>
      </div>
      <div class="settings-modal-footer">
        <span class="settings-feedback" id="settings-feedback"></span>
        <div style="display:flex;gap:8px;">
          <button class="btn" type="button" onclick="closeSettings()">Close</button>
          <button class="btn btn-primary" type="button" id="settings-save-btn" onclick="saveSettings()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
