# Global Praxis orchestrator settings. PRAXIS_<KEY> env vars override these.
loop_interval: 5       # seconds between orchestration loop passes. Until this
                       # key was wired through it did nothing and the loop ran
                       # at a hardcoded 5s, so 5 is the only value that has
                       # ever been exercised; it is kept as the shipped default
                       # for that reason. Raise it for a gentler loop, at the
                       # cost of that much added latency per state transition.
callback_grace: 5      # seconds to wait before reconciling a missing callback

# How often the approvals digest event may fire, in hours. Parked work is
# surfaced on poll_task, poll_plan, `praxis pending`, and the dashboard badge
# continuously; this only rate-limits the SSE event.
approvals_digest_interval_h: 6

# Admit a LOCAL filesystem path as a project's repo_url, enabling the local git
# backend (a bind-mounted bare repo, no GitHub credential, no PR object). OFF by
# default: it lets an authenticated caller point the orchestrator at any path
# the container can reach. Turn it on to run bench/ or to evaluate Praxis with
# no GitHub credential at all. This file is MOUNTED, so an edit takes effect on
# `docker compose restart orchestrator`, never an image rebuild.
allow_local_repo_paths: false

# Declared worker context windows, in tokens. The gate and the decomposer both
# read this, so a model declared here is sized the same in both places.
# Precedence: the project's context_window column > models > harnesses > probe.
# A model declared nowhere resolves to UNKNOWN: the budget gate is SKIPPED and
# says so (naming this key and this file's path) rather than inventing a number.
# That third state is the whole point. Before it existed, an undeclared cloud
# model fell back to 8192 and a correctly-sized task was failed in two seconds
# with a message blaming the task.
context_windows:
  models:
    "Gemini 3.7 Flash (High)": 1000000
    # glm-4.7 ships as a worker preset AND as an escalation rung, and its real
    # window is not declared anywhere in this repo. Left commented DELIBERATELY:
    # a guessed number here is the exact defect this key exists to remove.
    # Set it to your provider's published figure and both seams pick it up.
    # "glm-4.7": 200000
  harnesses:
    # Catches model-string variants nobody enumerated: Gemini 3.7 Pro, the agy
    # id spelling gemini-3.7-flash-high, and future tiers.
    agy: 1000000

capability:
  default:
    parameter_count_b: 30
    context_window: 8192
    strengths: "single-file edits, adding tests, small bug fixes"
    weaknesses: "multi-file refactors, novel architecture, large context"
    max_task_complexity: "medium"
    max_files_touched: 5
    max_loc_delta: 300
    max_checklist_items: 12
    max_dep_depth: 3
    escalate_task_types: []

escalation:
  policy: block   # block | brain | paid_fallback

# Ordered implementer ladder for a leaf the brain triages as "escalate".
# The implement seat is spawn-baked, so this is a dispatch-time substitution,
# not a router fallback chain. Escalation stops when this list is exhausted;
# the leaf then parks for a human.
#
# Every rung must name an implementer STRONGER than default_worker_model
# (currently agy / "Gemini 3.7 Flash (High)"), or the escalation is a no-op.
# Rung availability is deployment-specific: glm-4.7 needs an API key for the
# hosted endpoint, and qwen3.8-27b needs LM Studio reachable.
implement_escalation:
  - harness: opencode
    model: "glm-4.7"
  - harness: opencode
    model: "qwen3.8-27b"

# Hard ceiling on leaves in one plan, counting split children. Adaptive
# splitting without this is an unbounded token spend.
max_leaves_per_plan: 24

# Pre-dispatch difficulty scoring. PROVISIONAL hand-set weights (log-odds); the
# Capability Calibration Loop replaces them with learned per-(model, project)
# values. Signs are grounded in the literature; magnitudes are not claims.
# See docs/decomposition-standard.md section 2.
difficulty:
  bias: 1.60
  weights:
    files_touched: -0.45
    loc_ratio: -1.10
    dep_depth: -0.35
    has_acceptance: 1.30
    context_ratio: -1.40
    historical_success: 2.20
    repo_size_bucket: -0.25
    generic_type: -0.60
  # p_success below reject_below: the leaf goes back to the planner.
  # Between reject_below and flag_below: dispatch, but flagged and tightened.
  reject_below: 0.35
  flag_below: 0.55

models:
  registry:
    - { name: opus,   provider: claude, model: claude-opus-4-8,   effort: high }
    - { name: sonnet, provider: claude, model: claude-sonnet-4-6, effort: null }
    - { name: haiku,  provider: claude, model: claude-haiku-4-5,  effort: null }
    - { name: local,  provider: local,  model: "",                effort: null }
  roles:
    plan:      [sonnet, opus]
    review:    [sonnet, haiku]
    implement: [local]

default_worker_harness: agy
default_worker_model: "Gemini 3.7 Flash (High)"

# Thinking effort for implementation workers driven through a request option
# (OpenCode). Always STATED, never left absent: what the server does with a
# silent payload is not a stable API and has inverted twice on this endpoint
# (see core/thinking.py for both measurements). Harnesses that bake effort into
# the model string (agy) ignore this.
#
# `medium` on measured evidence, 2026-08-21, qwen3.8-27b. Two things drove it:
#
#   - `none` is not a cheap default, it is a wrong one. It answers confidently
#     and is silently incorrect on anything needing arithmetic or a schema: in
#     the operator's bake-off it reported a warehouse DOWN 5.9% when per-day it
#     was UP 12.9%, and emitted SQL selecting a column the aliased table does
#     not have. Fast, well formatted, wrong.
#   - The labels are not an ordered scale on this model. `medium` measured the
#     MOST thinking and the best answers, above `high`; `low` and `high` were
#     indistinguishable. Do not "upgrade" this to `high` on the assumption that
#     higher is more.
#
# This is the WORKER knob only. It does not reach plan_derive's json_schema
# extraction, which pins `none` because any thinking empties that response.
worker_reasoning_effort: medium

# Named worker configurations. Choosing one sets harness, model, and endpoint
# together; there is no new resolution logic, only fewer fields to get right.
#
# Listed in recommendation order, and `praxis init` offers the entry flagged
# `default: true` as its menu default. That flag exists because init's fallback
# rule (first preset needing no credential) cannot see that this deployment has
# ALREADY completed gemini-agy's one-time interactive sign-in; without it, Enter
# selected local-lmstudio and silently disagreed with default_worker_* above.
# The flag changes what is OFFERED, not what is checked: init still challenges
# an unmet requirement before accepting the choice.
worker_presets:
  - name: gemini-agy
    label: "Gemini via the agy harness"
    harness: agy
    model: "Gemini 3.7 Flash (High)"
    endpoint: ""
    requires: [interactive_login]
    default: true
    # Printed verbatim by `praxis init` when it challenges the unmet
    # requirement above.  Without this the operator was told WHAT was
    # missing and never HOW to supply it, which read as a dead end.
    setup_doc: "docs/deployment.md#agy-antigravity--gemini-harness--one-time-credential-setup"
    setup_hint: |
      Run these two commands once, then re-run `praxis init`:
        docker run --rm --user root -v praxis-gemini-creds:/home/agent/.gemini \
          --entrypoint bash agy-agent:latest -c 'chown -R agent:agent /home/agent/.gemini'
        docker run --rm -it -v praxis-gemini-creds:/home/agent/.gemini \
          --entrypoint bash agy-agent:latest -c 'agy'
      The second is interactive, and the bare `agy` is deliberate: there is
      no `agy login` subcommand, and running one prints a usage error that
      reads as a broken remedy. Launching the CLI with NO arguments is what
      starts the OAuth flow; it prints a URL to open in a browser.
  - name: local-lmstudio
    label: "Local GPU via LM Studio"
    harness: opencode
    model: "qwen3.8-27b"
    endpoint: "http://host.docker.internal:1234"
    requires: []
  # Last on purpose: this deployment has no api.z.ai key, so it is the one
  # preset that cannot be exercised or verified here.
  - name: hosted-openweight
    label: "Hosted open-weight model (OpenAI-compatible endpoint)"
    harness: opencode
    model: "glm-4.7"
    endpoint: "https://api.z.ai/v1"
    requires: [api_key]
    setup_doc: "docs/deployment.md"
    setup_hint: |
      Set an API key for your OpenAI-compatible endpoint in .env after init:
        LM_STUDIO_API_KEY=<your key>
      Then re-run `praxis init` and pick this preset again.

