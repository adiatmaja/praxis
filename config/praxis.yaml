# Global Praxis orchestrator settings. PRAXIS_<KEY> env vars override these.
loop_interval: 30      # seconds between orchestration loop passes
callback_grace: 5      # seconds to wait before reconciling a missing callback

capability:
  default:
    parameter_count_b: 30
    context_window: 8192
    strengths: "single-file edits, adding tests, small bug fixes"
    weaknesses: "multi-file refactors, novel architecture, large context"
    max_task_complexity: "medium"
    max_files_touched: 5
    max_loc_delta: 300
    max_checklist_items: 12
    max_dep_depth: 3
    escalate_task_types: []

escalation:
  policy: block   # block | brain | paid_fallback

models:
  registry:
    - { name: opus,   provider: claude, model: claude-opus-4-8,   effort: high }
    - { name: sonnet, provider: claude, model: claude-sonnet-4-6, effort: null }
    - { name: haiku,  provider: claude, model: claude-haiku-4-5,  effort: null }
    - { name: local,  provider: local,  model: "",                effort: null }
  roles:
    plan:      [sonnet, opus]
    review:    [sonnet, haiku]
    implement: [local]

default_worker_harness: agy
default_worker_model: "Gemini 3.6 Flash (High)"

# Named worker configurations. Choosing one sets harness, model, and endpoint
# together; there is no new resolution logic, only fewer fields to get right.
# `praxis init` offers hosted-openweight first because it needs no local GPU.
worker_presets:
  - name: hosted-openweight
    label: "Hosted open-weight model (OpenAI-compatible endpoint)"
    harness: opencode
    model: "glm-4.7"
    endpoint: "https://api.z.ai/v1"
    requires: [api_key]
  - name: local-lmstudio
    label: "Local GPU via LM Studio"
    harness: opencode
    model: "qwen3.6-27b"
    endpoint: "http://host.docker.internal:1234"
    requires: []
  - name: gemini-agy
    label: "Gemini via the agy harness"
    harness: agy
    model: "Gemini 3.6 Flash (High)"
    endpoint: ""
    requires: [interactive_login]

