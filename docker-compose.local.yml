services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
      args:
        PRAXIS_BUILD_SHA: ${PRAXIS_BUILD_SHA:-dev}
    # restart: unless-stopped is inherited from docker-compose.yml (the base file).
    # Compose merges the two files; the base restart policy applies here without
    # needing to repeat it.  Keep it that way: the control plane must outlive the
    # operator's terminal session.  A bare uvicorn process dies with the shell that
    # started it and orphans any in-flight agent tasks; a restarting container does not.
    volumes:
      - ./src:/app/src
      - ./web:/app/web
      # Mount the repo's .git so build_info.py can derive the real commit SHA at
      # runtime. Dev mounts source and hot-reloads, so the image's baked
      # PRAXIS_BUILD_SHA arg is always stale; blanking the env below makes
      # _resolve_commit() fall through to `git rev-parse` against this mount.
      - ./.git:/app/.git:ro
      # Global settings, MOUNTED not baked: an operator edit takes effect on
      # `docker compose restart orchestrator`, never an image rebuild. This
      # retires the 2026-07-27 gotcha where a default_worker_* change silently
      # kept serving the baked-in value. PRAXIS_CONFIG_PATH comes from the base
      # file through the compose environment merge.
      - ./config:/app/config:ro
      # Harness entrypoint sources, read-only: `praxis doctor`'s
      # agent_image_freshness check HASHES docker/*/entrypoint.sh and compares
      # that against the org.praxis.entrypoint-sha256 LABEL baked into each
      # image. The image does not COPY docker/, so without this mount the check
      # compares nothing and a stale agent image keeps running old logic
      # silently. It matters most in dev, where entrypoints are edited and the
      # rebuild is easy to forget.
      - ./docker:/app/docker:ro
      # .env, read-only: see the base file. Without it the env_drift check can
      # only ever answer "could not read .env" and the feature is inert.
      - ./.env:/app/.env:ro
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8080 --reload
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-dev-token}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-ghp_dev}
      - DATABASE_URL=sqlite+aiosqlite:///data/orchestrator.db
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
      # The worker preset `praxis init` records in .env. Bare pass-through, for
      # the reason spelled out in the base file: `${VAR:-default}` would hand
      # the container an authored value on every run and the mounted
      # config/praxis.yaml would never be read again. No dev default for the
      # same reason. Compose merges `environment` key-wise so the base entries
      # already cover this stack; restated so reading this file alone is not
      # misleading about what the dev orchestrator receives.
      - DEFAULT_WORKER_HARNESS
      - DEFAULT_WORKER_MODEL
      # Empty so build_info._resolve_commit() ignores the baked "dev" arg and
      # derives the live SHA from the mounted .git (stops /health showing "dev").
      - PRAXIS_BUILD_SHA=
