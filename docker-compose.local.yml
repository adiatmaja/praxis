services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
      args:
        PRAXIS_BUILD_SHA: ${PRAXIS_BUILD_SHA:-dev}
    # restart: unless-stopped is inherited from docker-compose.yml (the base file).
    # Compose merges the two files; the base restart policy applies here without
    # needing to repeat it.  Keep it that way: the control plane must outlive the
    # operator's terminal session.  A bare uvicorn process dies with the shell that
    # started it and orphans any in-flight agent tasks; a restarting container does not.
    volumes:
      - ./src:/app/src
      - ./web:/app/web
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8080 --reload
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-dev-token}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-ghp_dev}
      - DATABASE_URL=sqlite+aiosqlite:///data/orchestrator.db
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
