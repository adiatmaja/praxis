version: 2
updates:
  # Python deps: group tooling/dev deps aggressively; runtime deps stay
  # ungrouped so a breaking production bump is isolated and easy to bisect.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Only raise a >= floor when the installed set actually requires it, so a
    # brand-new release doesn't spawn a PR just to bump an already-satisfied
    # minimum. Security updates still come through regardless.
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: "development"
      linters-and-types:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "types-*"

  # GitHub Actions are low blast radius; batch every bump into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker/orchestrator"
    schedule:
      interval: "weekly"
    # Python is pinned to 3.11 project-wide (.python-version, requires-python,
    # CI matrix); a base-image major bump must be a deliberate, coordinated
    # upgrade, not an automated PR. Patch/minor security bumps still flow.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
