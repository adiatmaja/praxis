name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      # bench/ is deliberately outside the wheel (packages.find roots at src/)
      # and omitted from coverage, but it is NOT exempt from lint or types: it
      # grows through the benchmark phases and would otherwise rot unchecked.
      - name: Format check
        run: uv run ruff format --check src/ tests/ bench/

      - name: Lint
        run: uv run ruff check src/ tests/ bench/

      - name: Type check
        run: uv run mypy src/ bench/ --ignore-missing-imports

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Placeholder secrets so Settings() resolves without a .env file.
      AUTH_TOKEN: ci-test-token
      GITHUB_TOKEN: placeholder
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Tests
        run: uv run pytest --cov=orchestrator --cov-report=term-missing --cov-fail-under=80 --timeout=120
