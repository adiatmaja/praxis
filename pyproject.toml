[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "praxis"
version = "0.1.0"
description = "Provider-agnostic orchestrator that lets your AI assistant govern other coding agents through the execution phase of spec-driven development: plans decomposed to fit the worker model that implements them, every change gated and delivered as a PR you approve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Declared explicitly although pydantic-settings already pulls it in:
    # orchestrator/config.py imports dotenv_values DIRECTLY, to read the same
    # dotenv file pydantic-settings will read and with the same parser, so
    # that a value in `.env` cannot be shadowed by the settings file. An
    # undeclared import that happens to be present transitively breaks the
    # day the parent drops it.
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "docker>=7.0",
    "typer>=0.12",
    "rich>=13.0",
    "bcrypt>=4.0",
    "sse-starlette>=2.0",
    "mcp>=1.28.1",
    "pyjwt>=2.8",
    "cryptography>=50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
    "mypy>=1.0",
]

[project.scripts]
orchestrator-cli = "cli.main:app"
praxis = "cli.main:app"
praxis-mcp = "mcp_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_server = ["resources/*.md"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "EM", "ISC", "PIE", "PT", "Q", "RET", "SIM", "TID", "ARG"]
ignore = ["E501", "B008", "ARG001", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that touch the database",
]
# Hard per-test timeout (thread method works on Windows) so a hung test fails
# loudly instead of wedging the whole run, as the SSE log-stream test once did.
addopts = "-v --tb=short --timeout=120 --timeout-method=thread"

[tool.coverage.run]
# bench/ is dev-only (needs a GPU or a subscription CLI, neither of which
# exists on a CI runner) and is excluded from the 80 percent coverage gate.
omit = ["bench/*", "tests/*"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607"]
